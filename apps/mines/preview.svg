      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#49c8ff" filter="url(#glowS)">1</text>
    </g>
    <g transform="translate(70,140)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#69ffe1" filter="url(#glowS)">2</text>
    </g>
    <g transform="translate(140,140)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#69ffe1" filter="url(#glowS)">2</text>
    </g>
    <g transform="translate(210,140)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>
    <g transform="translate(280,140)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>
    <g transform="translate(350,140)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#49c8ff" filter="url(#glowS)">1</text>
    </g>
    <g transform="translate(420,140)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#tile)" stroke="#5ab8d0" stroke-opacity="0.55"/>
      <rect x="4" y="4" width="56" height="18" rx="6" fill="url(#tileHi)"/>
      <rect x="52" y="8" width="3" height="3" rx="1" fill="#eaffff" opacity="0.8"/>
    </g>

    <!-- Row 3 -->
    <g transform="translate(0,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>
    <g transform="translate(70,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>
    <g transform="translate(140,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#49c8ff" filter="url(#glowS)">1</text>
    </g>
    <g transform="translate(210,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#tile)" stroke="#5ab8d0" stroke-opacity="0.55"/>
      <rect x="4" y="4" width="56" height="18" rx="6" fill="url(#tileHi)"/>
    </g>
    <g transform="translate(280,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#tile)" stroke="#5ab8d0" stroke-opacity="0.55"/>
      <rect x="4" y="4" width="56" height="18" rx="6" fill="url(#tileHi)"/>
    </g>
    <g transform="translate(350,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#49c8ff" filter="url(#glowS)">1</text>
    </g>
    <g transform="translate(420,210)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>

    <!-- Row 4 -->
    <g transform="translate(0,280)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>
    <g transform="translate(70,280)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
    </g>
    <g transform="translate(140,280)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#49c8ff" filter="url(#glowS)">1</text>
    </g>
    <g transform="translate(210,280)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#rev)" stroke="#20384a"/>
      <text x="32" y="42" text-anchor="middle" font-family="'Space Grotesk', system-ui, sans-serif" font-size="30" font-weight="800" fill="#69ffe1" filter="url(#glowS)">2</text>
