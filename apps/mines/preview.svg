<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Black Holes</title>
  <desc id="desc">Exploration de secteurs spatiaux sur une grille néon : trous noirs révélés, satellites en orbite indiquant le danger et balises posées.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040814"/>
      <stop offset="0.45" stop-color="#071326"/>
      <stop offset="1" stop-color="#02060f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="18%" cy="22%" r="35%">
      <stop offset="0" stop-color="#00d2ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00d2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="82%" cy="78%" r="38%">
      <stop offset="0" stop-color="#7850ff" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#7850ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="holeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#140028" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#783cff" stop-opacity="0.28"/>
      <stop offset="0.75" stop-color="#ff64a0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="45%" cy="40%" r="55%">
      <stop offset="0" stop-color="#120018"/>
      <stop offset="0.6" stop-color="#050008"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="sat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaffff"/>
      <stop offset="1" stop-color="#6ccfd6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/>
  <rect width="720" height="380" fill="url(#neb2)"/>

  <g fill="#dffcff">
    <circle cx="30" cy="24" r="1.6" opacity="0.9"/><circle cx="92" cy="58" r="1" opacity="0.7"/><circle cx="150" cy="18" r="1.8" opacity="0.85"/>
    <circle cx="230" cy="42" r="1.2" opacity="0.75"/><circle cx="310" cy="20" r="2" opacity="0.9"/><circle cx="410" cy="36" r="1" opacity="0.7"/>
    <circle cx="520" cy="22" r="1.7" opacity="0.85"/><circle cx="610" cy="48" r="1.2" opacity="0.75"/><circle cx="690" cy="26" r="1.8" opacity="0.9"/>
    <circle cx="60" cy="110" r="1" opacity="0.65"/><circle cx="660" cy="120" r="1.4" opacity="0.8"/><circle cx="40" cy="320" r="1.6" opacity="0.8"/>
    <circle cx="680" cy="330" r="1.2" opacity="0.75"/><circle cx="120" cy="350" r="1" opacity="0.6"/><circle cx="580" cy="355" r="1.7" opacity="0.8"/>
  </g>

  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>

  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">BLACK HOLES</text>

  <!-- board frame -->
  <g transform="translate(160,70)">
    <rect x="-10" y="-10" width="400" height="260" rx="14" fill="rgba(4,14,22,0.4)" stroke="#69ffe1" stroke-opacity="0.25" stroke-width="2"/>

    <!-- cells grid 6x4 sample -->
    <g stroke="#69ffe1" stroke-opacity="0.18" stroke-width="1.2">
      <!-- hidden tiles -->
      <g fill="rgba(12,30,52,0.78)">
        <rect x="10" y="10" width="56" height="56" rx="8"/><rect x="74" y="10" width="56" height="56" rx="8"/><rect x="138" y="10" width="56" height="56" rx="8"/><rect x="266" y="10" width="56" height="56" rx="8"/>
        <rect x="10" y="74" width="56" height="56" rx="8"/><rect x="266" y="74" width="56" height="56" rx="8"/><rect x="330" y="74" width="56" height="56" rx="8"/>
        <rect x="138" y="138" width="56" height="56" rx="8"/><rect x="330" y="138" width="56" height="56" rx="8"/>
        <rect x="10" y="202" width="56" height="56" rx="8"/><rect x="74" y="202" width="56" height="56" rx="8"/><rect x="266" y="202" width="56" height="56" rx="8"/>
      </g>
      <!-- revealed safe tiles -->
      <g fill="rgba(6,22,28,0.78)" stroke-opacity="0.22">
        <rect x="202" y="10" width="56" height="56" rx="8"/><rect x="330" y="10" width="56" height="56" rx="8"/>
        <rect x="74" y="74" width="56" height="56" rx="8"/><rect x="138" y="74" width="56" height="56" rx="8"/><rect x="202" y="74" width="56" height="56" rx="8"/>
        <rect x="10" y="138" width="56" height="56" rx="8"/><rect x="74" y="138" width="56" height="56" rx="8"/><rect x="202" y="138" width="56" height="56" rx="8"/><rect x="266" y="138" width="56" height="56" rx="8"/>
        <rect x="138" y="202" width="56" height="56" rx="8"/><rect x="202" y="202" width="56" height="56" rx="8"/><rect x="330" y="202" width="56" height="56" rx="8"/>
      </g>
    </g>

    <!-- satellite count indicators (visual instead of numbers, color-coded by danger level) -->
    <!-- 2 satellites (green) -->
    <g transform="translate(230,102)" filter="url(#soft)">
      <g transform="translate(-11,-4) rotate(-20)"><rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/><rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#7cff7a" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#7cff7a" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/></g>
      <g transform="translate(11,4) rotate(160)"><rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/><rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#7cff7a" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#7cff7a" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/></g>
    </g>
    <!-- 1 satellite (cyan) -->
    <g transform="translate(358,38)" filter="url(#soft)">
      <g transform="translate(0,-10)"><rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/><rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#69ffe1" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#69ffe1" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/></g>
    </g>
    <!-- 3 satellites (gold) -->
    <g transform="translate(102,166)" filter="url(#soft)">
      <g transform="translate(0,-11)"><rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/><rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#ffd36b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#ffd36b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/></g>
      <g transform="translate(10,6) rotate(120)"><rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/><rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#ffd36b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#ffd36b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/></g>
      <g transform="translate(-10,6) rotate(240)"><rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/><rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#ffd36b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#ffd36b" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/><circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/></g>
    </g>

    <!-- revealed black hole -->
    <g transform="translate(38,102)" filter="url(#glow)">
      <circle cx="0" cy="0" r="22" fill="url(#holeGlow)"/>
      <ellipse cx="0" cy="0" rx="16" ry="6" fill="none" stroke="#b58aff" stroke-opacity="0.7" stroke-width="2" transform="rotate(18)"/>
      <ellipse cx="0" cy="0" rx="13" ry="4.5" fill="none" stroke="#ff78aa" stroke-opacity="0.55" stroke-width="1.5" transform="rotate(-28)"/>
      <circle cx="0" cy="0" r="8.5" fill="url(#core)" stroke="#dcc8ff" stroke-opacity="0.5" stroke-width="1.2"/>
    </g>

    <!-- placed satellite beacon (marker) -->
    <g transform="translate(166,38)" filter="url(#glow)">
      <g transform="scale(1.25)">
        <rect x="-3.2" y="-2.2" width="6.4" height="4.4" rx="1.2" fill="url(#sat)"/>
        <rect x="-8.5" y="-1.6" width="4.4" height="3.2" fill="#69ffe1" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/>
        <rect x="4.1" y="-1.6" width="4.4" height="3.2" fill="#69ffe1" stroke="#ffffff" stroke-opacity="0.6" stroke-width="0.6"/>
        <line x1="0" y1="-2.2" x2="0" y2="-5.2" stroke="#fff" stroke-width="0.7"/>
        <circle cx="0" cy="-5.5" r="0.9" fill="#ffd36b"/>
      </g>
      <ellipse cx="0" cy="14" rx="10" ry="3.5" fill="none" stroke="#69ffe1" stroke-opacity="0.4" stroke-width="1.5"/>
    </g>
  </g>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">SCANNEZ LES SECTEURS · LES SATELLITES RÉVÈLENT LES TROUS NOIRS VOISINS</text>
</svg>
