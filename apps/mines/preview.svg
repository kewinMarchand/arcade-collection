      <rect x="4" y="4" width="56" height="18" rx="6" fill="url(#tileHi)"/>
    </g>
    <g transform="translate(350,280)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#tile)" stroke="#5ab8d0" stroke-opacity="0.55"/>
      <rect x="4" y="4" width="56" height="18" rx="6" fill="url(#tileHi)"/>
    </g>
    <g transform="translate(420,280)">
      <rect x="0" y="0" width="64" height="64" rx="10" fill="url(#tile)" stroke="#5ab8d0" stroke-opacity="0.55"/>
      <rect x="4" y="4" width="56" height="18" rx="6" fill="url(#tileHi)"/>
    </g>
  </g>
</svg>