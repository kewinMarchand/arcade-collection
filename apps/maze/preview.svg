<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Maze</title>
  <desc id="desc">Labyrinthe néon avec pastilles et fantômes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a21"/>
      <stop offset="1" stop-color="#061013"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="380" rx="24" fill="url(#bg)"/>
  <!-- maze walls -->
  <g fill="#1a3a4a" stroke="#2a5a6a" stroke-width="1">
    <rect x="40" y="40" width="640" height="20" rx="4"/>
    <rect x="40" y="320" width="640" height="20" rx="4"/>
    <rect x="40" y="40" width="20" height="300" rx="4"/>
    <rect x="660" y="40" width="20" height="300" rx="4"/>
    <rect x="120" y="100" width="20" height="100" rx="4"/>
    <rect x="200" y="100" width="120" height="20" rx="4"/>
    <rect x="360" y="100" width="20" height="180" rx="4"/>
    <rect x="440" y="100" width="120" height="20" rx="4"/>
    <rect x="580" y="100" width="20" height="100" rx="4"/>
    <rect x="120" y="260" width="120" height="20" rx="4"/>
    <rect x="440" y="260" width="120" height="20" rx="4"/>
    <rect x="280" y="180" width="40" height="20" rx="4"/>
    <rect x="400" y="180" width="40" height="20" rx="4"/>
  </g>
  <!-- dots -->
  <g fill="#7bffe5" filter="url(#glow)">
    <circle cx="90" cy="75" r="3"/><circle cx="180" cy="75" r="3"/><circle cx="260" cy="75" r="3"/><circle cx="340" cy="75" r="3"/><circle cx="420" cy="75" r="3"/><circle cx="500" cy="75" r="3"/><circle cx="580" cy="75" r="3"/>
    <circle cx="90" cy="160" r="3"/><circle cx="260" cy="160" r="3"/><circle cx="460" cy="160" r="3"/><circle cx="580" cy="160" r="3"/>
    <circle cx="90" cy="240" r="3"/><circle cx="260" cy="240" r="3"/><circle cx="460" cy="240" r="3"/><circle cx="580" cy="240" r="3"/>
    <circle cx="90" cy="305" r="3"/><circle cx="180" cy="305" r="3"/><circle cx="260" cy="305" r="3"/><circle cx="340" cy="305" r="3"/><circle cx="420" cy="305" r="3"/><circle cx="500" cy="305" r="3"/><circle cx="580" cy="305" r="3"/>
  </g>
  <!-- power pellets -->
  <g fill="#ffd36b" filter="url(#glow)">
    <circle cx="80" cy="75" r="7"/><circle cx="640" cy="75" r="7"/><circle cx="80" cy="305" r="7"/><circle cx="640" cy="305" r="7"/>
  </g>
  <!-- player -->
  <g transform="translate(300 200)" filter="url(#glow)">
    <path d="M0 0 L12 -8 L12 8 Z" fill="#7bffe5"/>
    <circle cx="0" cy="0" r="9" fill="#7bffe5" opacity="0.9"/>
  </g>
  <!-- ghosts -->
  <g filter="url(#glow)">
    <g transform="translate(160 160)"><path d="M-9 9 L-9 -4 Q-9 -12 0 -12 Q9 -12 9 -4 L9 9 L6 6 L3 9 L0 6 L-3 9 L-6 6 Z" fill="#ff65b5"/><circle cx="-3" cy="-4" r="2" fill="#fff"/><circle cx="3" cy="-4" r="2" fill="#fff"/></g>
    <g transform="translate(500 240)"><path d="M-9 9 L-9 -4 Q-9 -12 0 -12 Q9 -12 9 -4 L9 9 L6 6 L3 9 L0 6 L-3 9 L-6 6 Z" fill="#ffad5c"/><circle cx="-3" cy="-4" r="2" fill="#fff"/><circle cx="3" cy="-4" r="2" fill="#fff"/></g>
    <g transform="translate(420 160)"><path d="M-9 9 L-9 -4 Q-9 -12 0 -12 Q9 -12 9 -4 L9 9 L6 6 L3 9 L0 6 L-3 9 L-6 6 Z" fill="#79ffd0"/><circle cx="-3" cy="-4" r="2" fill="#fff"/><circle cx="3" cy="-4" r="2" fill="#fff"/></g>
  </g>
  <text x="360" y="40" text-anchor="middle" fill="#7bffe5" font-family="system-ui,sans-serif" font-weight="800" font-size="22" letter-spacing="6">NEON MAZE</text>
  <text x="360" y="365" text-anchor="middle" fill="#8db6aa" font-family="system-ui,sans-serif" font-size="14" letter-spacing="3">MANGEZ LES PASTILLES - EVITEZ LES FANTOMES</text>
</svg>
