<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Maze</title>
  <desc id="desc">Labyrinthe néon avec murs technologiques, pastilles d'énergie, chasseur détaillé et fantômes stylisés sur fond quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.52" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="20%" cy="30%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="80%" cy="65%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e4b5d"/><stop offset="1" stop-color="#0d2533"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>
  <g fill="#f2fffc" opacity="0.7">
    <circle cx="30" cy="26" r="1.5"/><circle cx="120" cy="48" r="1"/><circle cx="250" cy="22" r="1.8"/><circle cx="470" cy="34" r="1.2"/><circle cx="650" cy="24" r="1.6"/>
  </g>
  <text x="360" y="44" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="24" letter-spacing="5">NEON MAZE</text>

  <!-- maze walls (tech modules) -->
  <g filter="url(#glow)">
    <g fill="url(#wall)" stroke="#69ffe1" stroke-opacity="0.35" stroke-width="1.5">
      <rect x="60" y="60" width="600" height="18" rx="5"/><rect x="60" y="322" width="600" height="18" rx="5"/>
      <rect x="60" y="60" width="18" height="280" rx="5"/><rect x="642" y="60" width="18" height="280" rx="5"/>
      <rect x="140" y="118" width="18" height="90" rx="5"/><rect x="220" y="118" width="110" height="18" rx="5"/>
      <rect x="380" y="118" width="18" height="160" rx="5"/><rect x="460" y="118" width="110" height="18" rx="5"/>
      <rect x="562" y="118" width="18" height="90" rx="5"/><rect x="140" y="262" width="110" height="18" rx="5"/>
      <rect x="460" y="262" width="110" height="18" rx="5"/><rect x="300" y="190" width="36" height="18" rx="5"/><rect x="420" y="190" width="36" height="18" rx="5"/>
    </g>
    <g stroke="#69ffe1" stroke-opacity="0.18" stroke-width="1">
      <line x1="90" y1="69" x2="90" y2="69"/><path d="M100 64v10 M140 64v10 M180 64v10 M220 64v10 M260 64v10 M300 64v10 M340 64v10 M380 64v10 M420 64v10 M460 64v10 M500 64v10 M540 64v10 M580 64v10 M620 64v10"/>
    </g>
  </g>

  <!-- energy dots -->
  <g fill="#69ffe1" filter="url(#glow)" opacity="0.95">
    <circle cx="110" cy="95" r="3.5"/><circle cx="190" cy="95" r="3.5"/><circle cx="270" cy="95" r="3.5"/><circle cx="350" cy="95" r="3.5"/><circle cx="430" cy="95" r="3.5"/><circle cx="510" cy="95" r="3.5"/><circle cx="610" cy="95" r="3.5"/>
    <circle cx="110" cy="170" r="3.5"/><circle cx="270" cy="170" r="3.5"/><circle cx="430" cy="170" r="3.5"/><circle cx="610" cy="170" r="3.5"/>
    <circle cx="110" cy="240" r="3.5"/><circle cx="270" cy="240" r="3.5"/><circle cx="430" cy="240" r="3.5"/><circle cx="610" cy="240" r="3.5"/>
    <circle cx="190" cy="305" r="3.5"/><circle cx="270" cy="305" r="3.5"/><circle cx="350" cy="305" r="3.5"/><circle cx="430" y="305" r="3.5"/><circle cx="510" cy="305" r="3.5"/><circle cx="610" cy="305" r="3.5"/>
  </g>
  <!-- power cores -->
  <g filter="url(#glow)">
    <circle cx="95" cy="95" r="8" fill="#ffd36b"/><circle cx="95" cy="95" r="4" fill="#fff7c8"/>
    <circle cx="625" cy="95" r="8" fill="#ffd36b"/><circle cx="625" cy="95" r="4" fill="#fff7c8"/>
    <circle cx="95" cy="305" r="8" fill="#ffd36b"/><circle cx="95" cy="305" r="4" fill="#fff7c8"/>
    <circle cx="625" cy="305" r="8" fill="#ffd36b"/><circle cx="625" cy="305" r="4" fill="#fff7c8"/>
  </g>

  <!-- player -->
  <g transform="translate(320,210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="11" fill="#69ffe1"/>
    <path d="M0 0 L13 -7 A13 13 0 1 1 13 7 Z" fill="#061412"/>
    <circle cx="3" cy="-4" r="2" fill="#fff"/><circle cx="3.8" cy="-4" r="0.9" fill="#10201c"/>
  </g>
  <!-- ghosts -->
  <g filter="url(#glow)">
    <g transform="translate(180,170)">
      <path d="M-10 10 L-10 -4 Q-10 -13 0 -13 Q10 -13 10 -4 L10 10 L7 7 L3.5 10 L0 7 L-3.5 10 L-7 7 Z" fill="#ff65b5"/>
      <ellipse cx="-3.5" cy="-4" rx="3" ry="3.5" fill="#fff"/><ellipse cx="3.5" cy="-4" rx="3" ry="3.5" fill="#fff"/>
      <circle cx="-2.5" cy="-4" r="1.4" fill="#10201c"/><circle cx="4.5" cy="-4" r="1.4" fill="#10201c"/>
    </g>
    <g transform="translate(520,240)">
      <path d="M-10 10 L-10 -4 Q-10 -13 0 -13 Q10 -13 10 -4 L10 10 L7 7 L3.5 10 L0 7 L-3.5 10 L-7 7 Z" fill="#ffad5c"/>
      <ellipse cx="-3.5" cy="-4" rx="3" ry="3.5" fill="#fff"/><ellipse cx="3.5" cy="-4" rx="3" ry="3.5" fill="#fff"/>
      <circle cx="-2.5" cy="-4" r="1.4" fill="#10201c"/><circle cx="4.5" cy="-4" r="1.4" fill="#10201c"/>
    </g>
    <g transform="translate(440,170)">
      <path d="M-10 10 L-10 -4 Q-10 -13 0 -13 Q10 -13 10 -4 L10 10 L7 7 L3.5 10 L0 7 L-3.5 10 L-7 7 Z" fill="#79ffd0"/>
      <ellipse cx="-3.5" cy="-4" rx="3" ry="3.5" fill="#fff"/><ellipse cx="3.5" cy="-4" rx="3" ry="3.5" fill="#fff"/>
      <circle cx="-2.5" cy="-4" r="1.4" fill="#10201c"/><circle cx="4.5" cy="-4" r="1.4" fill="#10201c"/>
    </g>
  </g>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">MANGEZ LES NOYAUX · ÉVITEZ LES DRONES</text>
</svg>
