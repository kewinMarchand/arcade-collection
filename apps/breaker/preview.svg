      <rect width="78" height="28" rx="6" fill="#1b3f52" stroke="#69ffe1" stroke-opacity="0.7"/><rect x="6" y="5" width="66" height="18" rx="4" fill="#102733"/><rect x="10" y="11" width="28" height="3" rx="1.5" fill="#b9fff0"/>
    </g>
    <g transform="translate(222,118)">
      <rect width="78" height="28" rx="6" fill="#1b3f52" stroke="#ff6fae" stroke-opacity="0.7"/><rect x="6" y="5" width="66" height="18" rx="4" fill="#102733"/><rect x="10" y="11" width="28" height="3" rx="1.5" fill="#ff9fce"/>
    </g>
    <g transform="translate(398,118)">
      <rect width="78" height="28" rx="6" fill="#1b3f52" stroke="#ffd36b" stroke-opacity="0.7"/><rect x="6" y="5" width="66" height="18" rx="4" fill="#102733"/><rect x="10" y="11" width="28" height="3" rx="1.5" fill="#ffe8a0"/>
    </g>
    <g transform="translate(486,118)">
      <rect width="78" height="28" rx="6" fill="#1b3f52" stroke="#8b8bff" stroke-opacity="0.7"/><rect x="6" y="5" width="66" height="18" rx="4" fill="#102733"/><rect x="10" y="11" width="28" height="3" rx="1.5" fill="#c4c4ff"/>
    </g>
  </g>

  <!-- ball -->
  <g filter="url(#glow)">
    <circle cx="360" cy="235" r="11" fill="url(#ball)" stroke="#eaffff" stroke-opacity="0.7"/>
    <circle cx="356" cy="231" r="3.5" fill="#fff" fill-opacity="0.85"/>
    <path d="M360 224 A11 11 0 0 1 371 235" stroke="#fff" stroke-opacity="0.5" stroke-width="2" fill="none"/>
  </g>

  <!-- paddle -->
