<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Breaker</title>
  <desc id="desc">Raquette technologique, noyau d'énergie et modules de briques détaillés sur fond néon quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.52" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="25%" cy="25%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="75%" cy="45%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="paddle" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dffcff"/><stop offset="0.4" stop-color="#69ffe1"/><stop offset="1" stop-color="#1a7a6a"/></linearGradient>
    <radialGradient id="ball" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#fff"/><stop offset="0.4" stop-color="#b9fff0"/><stop offset="1" stop-color="#2fd6b8"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>
  <g fill="#f2fffc" opacity="0.7"><circle cx="40" cy="28" r="1.5"/><circle cx="150" cy="50" r="1"/><circle cx="280" cy="22" r="1.8"/><circle cx="460" cy="36" r="1.2"/><circle cx="620" cy="24" r="1.6"/></g>
  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">BREAKER</text>

