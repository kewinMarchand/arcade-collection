  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">CASSEZ LES MODULES · GARDEZ LE NOYAU EN JEU</text>
