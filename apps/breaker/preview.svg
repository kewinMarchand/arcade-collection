    </g>
    <g transform="translate(178,80)">
      <rect width="78" height="28" rx="6" fill="#1b3f52" stroke="#ffd36b" stroke-opacity="0.8"/><rect x="6" y="5" width="66" height="18" rx="4" fill="#102733"/><rect x="10" y="11" width="30" height="3" rx="1.5" fill="#ffe8a0"/><circle cx="66" cy="14" r="3" fill="#69ffe1"/>
    </g>
    <g transform="translate(266,80)">
