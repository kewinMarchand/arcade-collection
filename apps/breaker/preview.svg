    <rect x="0" y="0" width="120" height="18" rx="9" fill="url(#paddle)" stroke="#eaffff" stroke-opacity="0.6"/>
    <rect x="14" y="4" width="92" height="10" rx="5" fill="#0b2628" fill-opacity="0.6"/>
    <circle cx="30" cy="9" r="2.5" fill="#fff"/><circle cx="60" cy="9" r="2.5" fill="#69ffe1"/><circle cx="90" cy="9" r="2.5" fill="#fff"/>
