  <rect x="12" y="12" width="696" height="356" rx="18" fill="none" stroke="#69ffe1" stroke-opacity="0.08"/>
  <text x="360" y="50" text-anchor="middle" fill="#7af7e0" font-family="'Space Grotesk', system-ui, sans-serif" font-weight="800" font-size="30" letter-spacing="7" filter="url(#gs)">NEON COLUMNS</text>

  <!-- Board frame -->
  <g transform="translate(240 72)">
    <rect x="-10" y="-8" width="260" height="284" rx="12" fill="#07131e" stroke="#3f5b73" stroke-width="2"/>
    <!-- grid lines -->
    <g stroke="#69ffe1" stroke-opacity="0.10" stroke-width="1">
      <path d="M30 0v268M60 0v268M90 0v268M120 0v268M150 0v268M180 0v268M210 0v268"/>
      <path d="M0 30h240M0 60h240M0 90h240M0 120h240M0 150h240M0 180h240M0 210h240M0 240h240"/>
    </g>
    <!-- subtle inner glow -->
    <rect x="0" y="0" width="240" height="268" rx="6" fill="none" stroke="#69ffe1" stroke-opacity="0.06"/>

    <!-- Falling piece (col ~4, rows 1-3): orb, diamond, alien -->
    <!-- Orb (yellow) -->
    <g transform="translate(105,45)" filter="url(#g)">
      <circle cx="0" cy="0" r="10" fill="#ffd36b"/>
      <g stroke="#ffd36b" stroke-width="2.2" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-19"/><line x1="0" y1="14" x2="0" y2="19"/>
        <line x1="-14" y1="0" x2="-19" y2="0"/><line x1="14" y1="0" x2="19" y2="0"/>
      </g>
      <circle cx="-3" cy="-3" r="2.5" fill="#fffbe0"/>
    </g>
    <!-- Diamond (violet) -->
    <g transform="translate(105,75)" filter="url(#g)">
      <path d="M0 -13 L10 -2 L7 11 L-7 11 L-10 -2 Z" fill="#b58aff"/>
      <path d="M0 -13 L0 11 M-10 -2 L10 -2" stroke="#ffffff66" stroke-width="1.5"/>
      <path d="M-1 -11 L-6 -2 L-1 -2 Z" fill="#ffffff55"/>
    </g>
    <!-- Alien (pink) -->
    <g transform="translate(105,105)" filter="url(#g)">
      <path d="M-13 -2 L-9 -9 L-3 -11 L3 -11 L9 -8 L13 -1 L10 6 L6 6 L3 11 L0 7 L-3 11 L-6 6 L-10 5 Z" fill="#ff648f"/>
      <rect x="-15" y="-3" width="3" height="6" rx="1" fill="#ff648f"/>
      <rect x="12" y="-3" width="3" height="6" rx="1" fill="#ff648f"/>
      <ellipse cx="-4" cy="-1" rx="2" ry="2.8" fill="#10201c"/>
      <ellipse cx="4" cy="-1" rx="2" ry="2.8" fill="#10201c"/>
    </g>

    <!-- Stacked gems bottom -->
    <!-- Row y=255 (bottom area) - a horizontal match of 3 capsules (teal) glowing -->
    <g filter="url(#g)">
      <g transform="translate(45,255)">
        <rect x="-10" y="-12" width="20" height="24" rx="9" fill="url(#cap)"/>
        <ellipse cx="0" cy="-1" rx="4.2" ry="5" fill="#13453f"/>
        <ellipse cx="0" cy="-2.5" rx="2.2" ry="2.8" fill="#c2fff1"/>
        <rect x="-7" y="3" width="2.5" height="4" fill="#faffc4"/><rect x="4.5" y="3" width="2.5" height="4" fill="#faffc4"/>
      </g>
      <g transform="translate(75,255)">
        <rect x="-10" y="-12" width="20" height="24" rx="9" fill="url(#cap)"/>
        <ellipse cx="0" cy="-1" rx="4.2" ry="5" fill="#13453f"/>
        <ellipse cx="0" cy="-2.5" rx="2.2" ry="2.8" fill="#c2fff1"/>
        <rect x="-7" y="3" width="2.5" height="4" fill="#faffc4"/><rect x="4.5" y="3" width="2.5" height="4" fill="#faffc4"/>
      </g>
      <g transform="translate(105,255)">
        <rect x="-10" y="-12" width="20" height="24" rx="9" fill="url(#cap)"/>
        <ellipse cx="0" cy="-1" rx="4.2" ry="5" fill="#13453f"/>
        <ellipse cx="0" cy="-2.5" rx="2.2" ry="2.8" fill="#c2fff1"/>
        <rect x="-7" y="3" width="2.5" height="4" fill="#faffc4"/><rect x="4.5" y="3" width="2.5" height="4" fill="#faffc4"/>
      </g>
      <!-- match highlight -->
      <rect x="28" y="238" width="94" height="34" rx="10" fill="none" stroke="#61ffe0" stroke-opacity="0.7" stroke-width="2"/>
    </g>

    <!-- other placed gems -->
    <g transform="translate(135,255)" filter="url(#gs)">
      <circle cx="0" cy="0" r="10" fill="#ffd36b"/>
      <g stroke="#ffd36b" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-18"/><line x1="0" y1="14" x2="0" y2="18"/>
        <line x1="-14" y1="0" x2="-18" y2="0"/><line x1="14" y1="0" x2="18" y2="0"/>
      </g>
    </g>
    <g transform="translate(165,255)" filter="url(#gs)">
      <path d="M-13 -2 L-9 -9 L-3 -11 L3 -11 L9 -8 L13 -1 L10 6 L6 6 L3 11 L0 7 L-3 11 L-6 6 L-10 5 Z" fill="#ff648f"/>
    </g>
    <g transform="translate(195,255)" filter="url(#gs)">
      <circle cx="0" cy="0" r="10" fill="#ffd36b"/>
      <g stroke="#ffd36b" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-18"/><line x1="0" y1="14" x2="0" y2="18"/>
        <line x1="-14" y1="0" x2="-18" y2="0"/><line x1="14" y1="0" x2="18" y2="0"/>
      </g>
    </g>
    <g transform="translate(225,255)" filter="url(#gs)">
      <path d="M0 -13 L10 -2 L7 11 L-7 11 L-10 -2 Z" fill="#b58aff"/>
    </g>

    <!-- row above -->
    <g transform="translate(45,225)" filter="url(#gs)">
      <path d="M0 -13 L12 -2 L7 2 L10 11 L0 5 L-10 11 L-7 2 L-12 -2 Z" fill="#8bffbd"/>
      <circle cx="0" cy="-1" r="3" fill="#0e2a1f"/>
    </g>
    <g transform="translate(75,225)" filter="url(#gs)">
      <path d="M0 -13 L10 -2 L7 11 L-7 11 L-10 -2 Z" fill="#b58aff"/>
    </g>
    <g transform="translate(105,225)" filter="url(#gs)">
      <path d="M-13 -2 L-9 -9 L-3 -11 L3 -11 L9 -8 L13 -1 L10 6 L6 6 L3 11 L0 7 L-3 11 L-6 6 L-10 5 Z" fill="#ff648f"/>
    </g>
    <g transform="translate(165,225)" filter="url(#gs)">
      <path d="M0 -13 L12 -2 L7 2 L10 11 L0 5 L-10 11 L-7 2 L-12 -2 Z" fill="#8bffbd"/>
      <circle cx="0" cy="-1" r="3" fill="#0e2a1f"/>
    </g>
    <g transform="translate(195,225)" filter="url(#gs)">
      <rect x="-10" y="-12" width="20" height="24" rx="9" fill="url(#cap)"/>
    </g>

    <!-- a couple higher -->
    <g transform="translate(75,195)" filter="url(#gs)">
      <circle cx="0" cy="0" r="10" fill="#ffd36b"/>
      <g stroke="#ffd36b" stroke-width="2" stroke-linecap="round">
        <line x1="0" y1="-14" x2="0" y2="-18"/><line x1="0" y1="14" x2="0" y2="18"/>
        <line x1="-14" y1="0" x2="-18" y2="0"/><line x1="14" y1="0" x2="18" y2="0"/>
      </g>
    </g>
    <g transform="translate(105,195)" filter="url(#gs)">
      <path d="M0 -13 L12 -2 L7 2 L10 11 L0 5 L-10 11 L-7 2 L-12 -2 Z" fill="#8bffbd"/>
      <circle cx="0" cy="-1" r="3" fill="#0e2a1f"/>
    </g>
  </g>
