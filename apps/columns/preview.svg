  <g class="stars" aria-hidden="true">
    <circle cx="28" cy="34" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="62" cy="78" r="1.1" fill="#dffcff" opacity="0.7"/>
    <circle cx="96" cy="22" r="1.4" fill="#ffffff" opacity="0.85"/>
    <circle cx="138" cy="58" r="0.9" fill="#dffcff" opacity="0.6"/>
    <circle cx="176" cy="96" r="1.6" fill="#ffffff" opacity="0.8"/>
    <circle cx="214" cy="30" r="1.0" fill="#dffcff" opacity="0.65"/>
    <circle cx="252" cy="72" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="292" cy="18" r="1.2" fill="#dffcff" opacity="0.75"/>
    <circle cx="334" cy="54" r="0.8" fill="#ffffff" opacity="0.55"/>
    <circle cx="372" cy="86" r="1.5" fill="#dffcff" opacity="0.8"/>
    <circle cx="412" cy="26" r="1.1" fill="#ffffff" opacity="0.7"/>
    <circle cx="448" cy="64" r="1.9" fill="#dffcff" opacity="0.9"/>
    <circle cx="486" cy="38" r="0.9" fill="#ffffff" opacity="0.6"/>
    <circle cx="524" cy="92" r="1.4" fill="#dffcff" opacity="0.75"/>
    <circle cx="562" cy="20" r="1.7" fill="#ffffff" opacity="0.85"/>
    <circle cx="598" cy="70" r="1.0" fill="#dffcff" opacity="0.65"/>
    <circle cx="634" cy="44" r="1.3" fill="#ffffff" opacity="0.8"/>
    <circle cx="668" cy="88" r="0.9" fill="#dffcff" opacity="0.6"/>
    <circle cx="694" cy="28" r="1.6" fill="#ffffff" opacity="0.85"/>
    <circle cx="44" cy="140" r="1.2" fill="#dffcff" opacity="0.7"/>
    <circle cx="118" cy="168" r="0.8" fill="#ffffff" opacity="0.5"/>
    <circle cx="204" cy="132" r="1.5" fill="#dffcff" opacity="0.75"/>
    <circle cx="318" cy="152" r="1.0" fill="#ffffff" opacity="0.6"/>
    <circle cx="402" cy="118" r="1.3" fill="#dffcff" opacity="0.7"/>
    <circle cx="508" cy="146" r="0.9" fill="#ffffff" opacity="0.55"/>
    <circle cx="586" cy="126" r="1.6" fill="#dffcff" opacity="0.8"/>
    <circle cx="676" cy="160" r="1.1" fill="#ffffff" opacity="0.65"/>
    <circle cx="22" cy="210" r="1.4" fill="#ffffff" opacity="0.7"/>
    <circle cx="156" cy="228" r="1.0" fill="#dffcff" opacity="0.6"/>
