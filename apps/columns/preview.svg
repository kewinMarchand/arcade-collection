<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Columns</title>
  <desc id="desc">Colonne d'artefacts néon détaillés tombant dans une grille, avec alignement lumineux sur fond quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.52" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="25%" cy="25%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="75%" cy="55%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>
  <g fill="#f2fffc" opacity="0.75"><circle cx="40" cy="28" r="1.6"/><circle cx="160" cy="46" r="1"/><circle cx="300" cy="22" r="1.8"/><circle cx="520" cy="34" r="1.2"/><circle cx="660" cy="24" r="1.6"/></g>
  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">NEON COLUMNS</text>

  <!-- board -->
  <rect x="220" y="70" width="280" height="280" rx="10" fill="rgba(4,14,22,0.45)" stroke="#69ffe1" stroke-opacity="0.25" stroke-width="2"/>
  <g stroke="#69ffe1" stroke-opacity="0.12" stroke-width="1">
    <path d="M260 70v280M300 70v280M340 70v280M380 70v280M420 70v280M460 70v280"/>
    <path d="M220 110h280M220 150h280M220 190h280M220 230h280M220 270h280M220 310h280"/>
  </g>

  <!-- stacked artifacts -->
  <g filter="url(#glow)">
    <!-- bottom row -->
    <g transform="translate(240,330)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="7" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#69ffe1"/></g>
    <g transform="translate(280,330)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#ffd36b" stroke-width="2"/><path d="M0 -9l7 7-3 10h-8l-3-10z" fill="#ffd36b"/></g>
    <g transform="translate(320,330)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="7" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#69ffe1"/></g>
    <g transform="translate(360,330)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="7" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#69ffe1"/></g>
    <g transform="translate(400,330)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#ff6fae" stroke-width="2"/><rect x="-5" y="-8" width="10" height="16" rx="5" fill="#ff9fce"/></g>
    <g transform="translate(440,330)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#8b8bff" stroke-width="2"/><path d="M0 -8l9 8-9 8-9-8z" fill="#8b8bff"/><circle cx="0" cy="0" r="2.5" fill="#fff"/></g>
    <!-- middle -->
    <g transform="translate(280,290)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#ff6fae" stroke-width="2"/><rect x="-5" y="-8" width="10" height="16" rx="5" fill="#ff9fce"/></g>
    <g transform="translate(360,290)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#7cff7a" stroke-width="2"/><circle cx="0" cy="0" r="7" fill="#7cff7a"/><path d="M-8 0h16M0 -8v16" stroke="#fff" stroke-width="2"/></g>
    <g transform="translate(440,290)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#ffd36b" stroke-width="2"/><path d="M0 -9l7 7-3 10h-8l-3-10z" fill="#ffd36b"/></g>
    <!-- falling column -->
    <g transform="translate(360,130)">
      <g transform="translate(0,0)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#8b8bff" stroke-width="2"/><path d="M0 -8l9 8-9 8-9-8z" fill="#8b8bff"/><circle cx="0" cy="0" r="2.5" fill="#fff"/></g>
      <g transform="translate(0,40)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="7" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#69ffe1"/></g>
      <g transform="translate(0,80)"><rect x="-16" y="-16" width="32" height="32" rx="8" fill="#10232d" stroke="#ff6fae" stroke-width="2"/><rect x="-5" y="-8" width="10" height="16" rx="5" fill="#ff9fce"/></g>
    </g>
  </g>

  <!-- alignment highlight -->
  <rect x="302" y="312" width="76" height="36" rx="8" fill="none" stroke="#69ffe1" stroke-opacity="0.5" stroke-width="2" filter="url(#glow)"/>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">ALIGNEZ LES ARTEFACTS · DÉCLENCHEZ LES RÉACTIONS</text>
</svg>
