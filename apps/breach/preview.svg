<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Breach</title>
  <desc id="desc">Couloir FPS néon avec un drone alien détaillé, orbes de slime collées aux parois, mini-carte et porte d'extraction.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#071b22"/>
      <stop offset="0.55" stop-color="#041117"/>
      <stop offset="1" stop-color="#02070b"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2430"/>
      <stop offset="1" stop-color="#06131d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="45%">
      <stop offset="0" stop-color="#39ffd9" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#39ffd9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="slime" cx="40%" cy="35%" r="60%">
      <stop offset="0" stop-color="#d8ff9a"/>
      <stop offset="0.45" stop-color="#7cff5a"/>
      <stop offset="1" stop-color="#39ff14"/>
    </radialGradient>
    <filter id="neon" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#glow)"/>
  <g stroke="#9bfff0" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>

  <!-- corridor walls -->
  <path d="M40 40 L260 110 L260 290 L40 340 Z" fill="#0a1e2a" stroke="#1f5564" stroke-width="2"/>
  <path d="M680 40 L460 110 L460 290 L680 340 Z" fill="#0a1e2a" stroke="#1f5564" stroke-width="2"/>
  <path d="M260 110 L460 110 L460 290 L260 290 Z" fill="#081722" stroke="#184453" stroke-width="2"/>
  <path d="M40 340 L260 290 L460 290 L680 340 Z" fill="url(#floor)"/>

  <!-- neon trims -->
  <g stroke="#3dffe0" stroke-width="3" opacity="0.85" filter="url(#neon)">
    <line x1="62" y1="58" x2="246" y2="116"/>
    <line x1="658" y1="58" x2="474" y2="116"/>
    <line x1="260" y1="112" x2="460" y2="112"/>
    <line x1="260" y1="288" x2="460" y2="288"/>
  </g>

  <!-- extraction door (active) -->
  <g transform="translate(360,200)" filter="url(#neon)">
    <rect x="-44" y="-62" width="88" height="110" rx="8" fill="#1c2e38" stroke="#58ff9a" stroke-width="3"/>
    <rect x="-30" y="-50" width="60" height="86" rx="6" fill="#0a3a22" fill-opacity="0.7"/>
    <ellipse cx="0" cy="0" rx="22" ry="34" fill="#1aff88" fill-opacity="0.18" stroke="#58ff9a" stroke-width="2"/>
    <rect x="-32" y="-58" width="64" height="6" rx="3" fill="#58ff9a"/>
  </g>

  <!-- slime splats on walls -->
  <g filter="url(#soft)">
    <ellipse cx="210" cy="170" rx="18" ry="10" fill="url(#slime)" opacity="0.9" transform="rotate(-12 210 170)"/>
    <ellipse cx="510" cy="155" rx="16" ry="9" fill="url(#slime)" opacity="0.85" transform="rotate(10 510 155)"/>
    <ellipse cx="180" cy="245" rx="14" ry="8" fill="url(#slime)" opacity="0.8" transform="rotate(-8 180 245)"/>
    <ellipse cx="360" cy="285" rx="20" ry="8" fill="url(#slime)" opacity="0.75"/>
    <circle cx="228" cy="182" r="5" fill="#7cff5a" opacity="0.85"/><circle cx="492" cy="166" r="4.5" fill="#7cff5a" opacity="0.8"/>
  </g>

  <!-- detailed alien ship/drone -->
  <g transform="translate(360,188)" filter="url(#neon)">
    <ellipse cx="0" cy="4" rx="42" ry="14" fill="#163142" stroke="#ff65b5" stroke-opacity="0.4"/>
    <ellipse cx="0" cy="0" rx="34" ry="12" fill="#204255"/>
    <ellipse cx="0" cy="-6" rx="16" ry="10" fill="#e9fdff" fill-opacity="0.85" stroke="#ff65b5" stroke-width="2"/>
    <circle cx="0" cy="-8" r="4" fill="#ffffff"/>
    <path d="M-40 2 L-62 -8 L-48 10 Z" fill="#ff65b5" fill-opacity="0.85"/>
    <path d="M40 2 L62 -8 L48 10 Z" fill="#ff65b5" fill-opacity="0.85"/>
    <circle cx="-62" cy="-8" r="4" fill="#ff9fce"/><circle cx="62" cy="-8" r="4" fill="#ff9fce"/>
    <ellipse cx="0" cy="16" rx="12" ry="5" fill="#09161d" stroke="#ff65b5" stroke-opacity="0.5"/>
    <ellipse cx="0" cy="18" rx="7" ry="3" fill="#ff65b5" fill-opacity="0.9"/>
    <circle cx="-10" cy="2" r="3" fill="#fff"/><circle cx="10" cy="2" r="3" fill="#fff"/>
    <rect x="-18" y="0" width="36" height="3" rx="1.5" fill="#ff65b5" fill-opacity="0.8"/>
  </g>

  <!-- flying slime orb (projectile) -->
  <g transform="translate(430,220)" filter="url(#neon)">
    <circle cx="0" cy="0" r="10" fill="url(#slime)"/>
    <circle cx="-3" cy="-3" r="3" fill="#f2ffd8" fill-opacity="0.8"/>
  </g>

  <!-- minimap -->
  <g transform="translate(572,60)">
    <rect x="0" y="0" width="108" height="88" rx="8" fill="rgba(6,16,22,0.92)" stroke="#69ffe1" stroke-opacity="0.35"/>
    <g fill="#274657">
      <rect x="8" y="8" width="92" height="8"/><rect x="8" y="72" width="92" height="8"/><rect x="8" y="8" width="8" height="72"/><rect x="92" y="8" width="8" height="72"/>
      <rect x="30" y="24" width="8" height="24"/><rect x="54" y="40" width="24" height="8"/>
    </g>
    <circle cx="78" cy="60" r="4" fill="#58ff9a"/>
    <circle cx="28" cy="56" r="3.5" fill="#ff4f78"/>
    <circle cx="50" cy="30" r="3" fill="#ffd36b"/>
    <polygon points="20,36 16,44 24,44" fill="#69ffe1"/>
    <text x="54" y="-6" text-anchor="middle" fill="#9dc8c0" font-family="system-ui,sans-serif" font-size="10">MINI-CARTE</text>
  </g>

  <!-- crosshair -->
  <g stroke="#e8fbff" stroke-width="2" opacity="0.9">
    <circle cx="360" cy="230" r="14" fill="none"/>
    <line x1="360" y1="208" x2="360" y2="218"/><line x1="360" y1="242" x2="360" y2="252"/>
    <line x1="338" y1="230" x2="348" y2="230"/><line x1="372" y1="230" x2="382" y2="230"/>
  </g>

  <text x="360" y="365" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">INFILTREZ · SLIME COLLANT · ATTEIGNEZ LA SORTIE</text>
</svg>
