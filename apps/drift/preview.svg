<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Drift</title>
  <desc id="desc">Vaisseau de course néon sur piste en perspective, évitant une mine-drone et collectant un noyau d'énergie, sous un ciel quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.45" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="22%" cy="20%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="78%" cy="22%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#172443"/><stop offset="1" stop-color="#090e1e"/></linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9ffff"/><stop offset="0.38" stop-color="#64ffe0"/><stop offset="1" stop-color="#138b94"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>

  <!-- sky grid (invaders-style generalized) -->
  <g stroke="#9bfff0" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 30H720M0 70H720M0 110H720M0 150H720"/>
    <path d="M60 0V180M120 0V180M180 0V180M240 0V170M300 0V160M360 0V155M420 0V160M480 0V170M540 0V180M600 0V180M660 0V180"/>
  </g>
  <g fill="#f2fffc" opacity="0.75"><circle cx="40" cy="24" r="1.6"/><circle cx="140" cy="46" r="1"/><circle cx="260" cy="20" r="1.8"/><circle cx="420" cy="34" r="1.2"/><circle cx="560" cy="22" r="1.6"/><circle cx="660" cy="40" r="1"/></g>

  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">NEON DRIFT</text>

  <path d="M215 110h290l120 250H95z" fill="url(#road)" stroke="#35d9cc" stroke-opacity="0.5" stroke-width="3"/>
  <path d="M285 112l-50 246M435 112l50 246" stroke="#6c81ff" stroke-width="3" stroke-dasharray="18 17" opacity="0.8"/>
  <path d="M360 110v250" stroke="#69ffe1" stroke-width="2" stroke-dasharray="14 18" opacity="0.35"/>

  <!-- obstacle mine/drone -->
  <g transform="translate(300,205)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="#2a1020" stroke="#ff6fae" stroke-width="2"/>
    <g stroke="#ff6fae" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-14"/><line x1="0" y1="14" x2="0" y2="24"/>
      <line x1="-24" y1="0" x2="-14" y2="0"/><line x1="14" y1="0" x2="24" y2="0"/>
      <line x1="-17" y1="-17" x2="-10" y2="-10"/><line x1="10" y1="10" x2="17" y2="17"/>
      <line x1="17" y1="-17" x2="10" y2="-10"/><line x1="-10" y1="10" x2="-17" y2="17"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#ff9fce"/><circle cx="0" cy="0" r="3.5" fill="#fff"/>
  </g>

  <!-- energy orb collectible -->
  <g transform="translate(430,225)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#0f2a24" stroke="#69ffe1" stroke-width="2"/>
    <polygon points="0,-9 8,0 0,9 -8,0" fill="#69ffe1" fill-opacity="0.85"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
  </g>

  <!-- detailed car/ship -->
  <g transform="translate(360,292) rotate(-4)" filter="url(#glow)">
    <path d="M-24 42q-8 8-14 20m66-20q8 8 14 20" stroke="#7df3ff" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <rect x="-26" y="-34" width="52" height="62" rx="24" fill="url(#car)" stroke="#eaffff" stroke-width="2.5" stroke-opacity="0.7"/>
    <path d="M-26 0 L-36 12 L-24 14 Z" fill="#1fa88f"/><path d="M26 0 L36 12 L24 14 Z" fill="#1fa88f"/>
    <ellipse cx="0" cy="-12" rx="12" ry="14" fill="#237d73" stroke="#b6ffff" stroke-width="2"/>
    <ellipse cx="0" cy="-16" rx="7" ry="8" fill="#c2fff1"/>
    <rect x="-10" y="10" width="20" height="6" rx="3" fill="#0b2628" fill-opacity="0.6"/>
    <rect x="-20" y="18" width="6" height="8" rx="2" fill="#faffc4"/><rect x="14" y="18" width="6" height="8" rx="2" fill="#faffc4"/>
  </g>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">ESQUIVEZ LES DRONES · RÉCOLTEZ LES NOYAUX</text>
</svg>
