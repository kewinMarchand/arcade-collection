<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Pong</title>
  <desc id="desc">Deux raquettes technologiques détaillées renvoient un noyau d'énergie sur un fond néon quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.52" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="22%" cy="35%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="78%" cy="60%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="padL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f3b3a"/><stop offset="0.5" stop-color="#1dbfa3"/><stop offset="1" stop-color="#dffcff"/></linearGradient>
    <linearGradient id="padR" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="#3a1233"/><stop offset="0.5" stop-color="#ff6dbe"/><stop offset="1" stop-color="#ffe6f5"/></linearGradient>
    <radialGradient id="core" cx="35%" cy="35%" r="65%"><stop offset="0" stop-color="#ffffff"/><stop offset="0.4" stop-color="#b9fff0"/><stop offset="1" stop-color="#2fd6b8"/></radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>
  <g fill="#f2fffc" opacity="0.7">
    <circle cx="50" cy="30" r="1.5"/><circle cx="140" cy="60" r="1"/><circle cx="260" cy="24" r="1.8"/><circle cx="430" cy="40" r="1.2"/><circle cx="560" cy="26" r="1.6"/><circle cx="670" cy="54" r="1"/>
  </g>
  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">NEON PONG</text>

  <line x1="360" y1="70" x2="360" y2="340" stroke="#7bffe5" stroke-width="2" stroke-dasharray="8 14" opacity="0.3"/>
  <circle cx="360" cy="205" r="54" fill="none" stroke="#7bffe5" stroke-opacity="0.12" stroke-width="2"/>

  <!-- left paddle (tech shield) -->
  <g transform="translate(50,150)" filter="url(#glow)">
    <rect x="0" y="0" width="18" height="96" rx="9" fill="url(#padL)" stroke="#7bffe5" stroke-opacity="0.8"/>
    <rect x="4" y="12" width="10" height="72" rx="5" fill="#0b2628" fill-opacity="0.7"/>
    <rect x="6" y="24" width="6" height="20" rx="3" fill="#7bffe5" fill-opacity="0.8"/>
    <rect x="6" y="52" width="6" height="20" rx="3" fill="#7bffe5" fill-opacity="0.5"/>
    <circle cx="9" cy="18" r="2" fill="#fff"/><circle cx="9" cy="78" r="2" fill="#fff"/>
  </g>
  <!-- right paddle -->
  <g transform="translate(652,164)" filter="url(#glow)">
    <rect x="0" y="0" width="18" height="96" rx="9" fill="url(#padR)" stroke="#ff6dbe" stroke-opacity="0.8"/>
    <rect x="4" y="12" width="10" height="72" rx="5" fill="#250b20" fill-opacity="0.7"/>
    <rect x="6" y="24" width="6" height="20" rx="3" fill="#ff9fce" fill-opacity="0.8"/>
    <rect x="6" y="52" width="6" height="20" rx="3" fill="#ff9fce" fill-opacity="0.5"/>
    <circle cx="9" cy="18" r="2" fill="#fff"/><circle cx="9" cy="78" r="2" fill="#fff"/>
  </g>

  <!-- ball trail and core -->
  <g filter="url(#glow)">
    <circle cx="300" cy="214" r="5" fill="#69ffe1" opacity="0.25"/>
    <circle cx="330" cy="206" r="6.5" fill="#69ffe1" opacity="0.4"/>
    <circle cx="360" cy="198" r="8" fill="#69ffe1" opacity="0.55"/>
    <circle cx="390" cy="190" r="11" fill="url(#core)" stroke="#eaffff" stroke-opacity="0.7"/>
    <circle cx="386" cy="186" r="3.5" fill="#fff" fill-opacity="0.8"/>
    <path d="M390 179 L390 201 M379 190 L401 190" stroke="#fff" stroke-opacity="0.5" stroke-width="1.5"/>
  </g>

  <text x="180" y="360" text-anchor="middle" fill="#7bffe5" font-family="system-ui,'DM Mono',monospace" font-weight="700" font-size="30">07</text>
  <text x="540" y="360" text-anchor="middle" fill="#ff6dbe" font-family="system-ui,'DM Mono',monospace" font-weight="700" font-size="30">05</text>
</svg>
