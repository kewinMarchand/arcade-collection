<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Pong</title>
  <desc id="desc">Pong néon : deux palettes et une balle lumineuse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1a2a"/>
      <stop offset="1" stop-color="#060d18"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="380" rx="24" fill="url(#bg)"/>
  <!-- center line -->
  <line x1="360" y1="20" x2="360" y2="360" stroke="#7bffe5" stroke-width="2" stroke-dasharray="8 12" opacity="0.4"/>
  <!-- left paddle -->
  <rect x="40" y="140" width="14" height="90" rx="7" fill="#7bffe5" filter="url(#glow)"/>
  <!-- right paddle -->
  <rect x="666" y="200" width="14" height="90" rx="7" fill="#ff6dbe" filter="url(#glow)"/>
  <!-- ball trail -->
  <circle cx="300" cy="195" r="4" fill="#8b8bff" opacity="0.3"/>
  <circle cx="330" cy="190" r="5" fill="#8b8bff" opacity="0.5"/>
  <circle cx="360" cy="185" r="6" fill="#8b8bff" opacity="0.7"/>
  <!-- ball -->
  <circle cx="390" cy="180" r="9" fill="#7bffe5" filter="url(#glow)"/>
  <text x="360" y="50" text-anchor="middle" fill="#7bffe5" font-family="system-ui,sans-serif" font-weight="800" font-size="24" letter-spacing="6">NEON PONG</text>
  <text x="180" y="365" text-anchor="middle" fill="#7bffe5" font-family="system-ui,sans-serif" font-weight="700" font-size="28">07</text>
  <text x="540" y="365" text-anchor="middle" fill="#ff6dbe" font-family="system-ui,sans-serif" font-weight="700" font-size="28">05</text>
</svg>
