    <circle cx="534" cy="202" r="1.0" fill="#ffffff" opacity="0.64"/>
    <circle cx="590" cy="186" r="2.0" fill="#ffffff" opacity="0.85"/>
    <circle cx="646" cy="218" r="1.4" fill="#bff6ff" opacity="0.7"/>
    <circle cx="698" cy="192" r="1.7" fill="#dffcff" opacity="0.82"/>
    <circle cx="48" cy="252" r="1.1" fill="#ffffff" opacity="0.66"/>
    <circle cx="112" cy="276" r="1.8" fill="#dffcff" opacity="0.8"/>
