<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Runner</title>
  <desc id="desc">Coureur mécanique néon sautant par-dessus une mine et collectant un noyau d'énergie sur piste technologique, sous ciel quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.45" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="22%" cy="22%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="78%" cy="28%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f2230"/><stop offset="1" stop-color="#08131d"/></linearGradient>
    <linearGradient id="runner" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#62ffe0"/><stop offset="0.5" stop-color="#6fb6ff"/><stop offset="1" stop-color="#69ffe1"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <!-- sky grid -->
  <g stroke="#9bfff0" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 35H720M0 75H720M0 115H720M0 155H720M0 195H720"/>
    <path d="M60 0V220M120 0V220M180 0V220M240 0V220M300 0V220M360 0V220M420 0V220M480 0V220M540 0V220M600 0V220M660 0V220"/>
  </g>
  <g fill="#f2fffc" opacity="0.75"><circle cx="40" cy="26" r="1.6"/><circle cx="140" cy="48" r="1"/><circle cx="280" cy="22" r="1.8"/><circle cx="460" cy="36" r="1.2"/><circle cx="620" cy="24" r="1.6"/></g>
  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">RUNNER</text>

  <!-- ground -->
  <rect x="0" y="285" width="720" height="95" fill="url(#ground)"/>
  <line x1="0" y1="285" x2="720" y2="285" stroke="#69ffe1" stroke-width="3" filter="url(#glow)" opacity="0.8"/>
  <g stroke="#69ffe1" stroke-opacity="0.12" stroke-width="1">
    <path d="M0 315H720M0 345H720"/>
    <path d="M60 285v95M120 285v95M180 285v95M240 285v95M300 285v95M360 285v95M420 285v95M480 285v95M540 285v95M600 285v95M660 285v95"/>
  </g>

  <!-- obstacle mine -->
  <g transform="translate(360,262)" filter="url(#glow)">
    <circle cx="0" cy="0" r="18" fill="#2a1020" stroke="#ff6fae" stroke-width="2"/>
    <g stroke="#ff6fae" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-24" x2="0" y2="-14"/><line x1="0" y1="14" x2="0" y2="24"/>
      <line x1="-24" y1="0" x2="-14" y2="0"/><line x1="14" y1="0" x2="24" y2="0"/>
      <line x1="-17" y1="-17" x2="-10" y2="-10"/><line x1="10" y1="10" x2="17" y2="17"/>
      <line x1="17" y1="-17" x2="10" y2="-10"/><line x1="-10" y1="10" x2="-17" y2="17"/>
    </g>
    <circle cx="0" cy="0" r="8" fill="#ff9fce"/><circle cx="0" cy="0" r="3.5" fill="#fff"/>
  </g>

  <!-- energy orb -->
  <g transform="translate(520,210)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="#0f2a24" stroke="#ffd36b" stroke-width="2"/>
    <polygon points="0,-9 8,0 0,9 -8,0" fill="#ffd36b"/>
    <circle cx="0" cy="0" r="4" fill="#fff"/>
  </g>

  <!-- mech runner (jumping) -->
  <g transform="translate(230,220)" filter="url(#glow)">
    <ellipse cx="-18" cy="28" rx="10" ry="5" fill="#69ffe1" fill-opacity="0.4"/>
    <rect x="-14" y="-6" width="28" height="34" rx="10" fill="url(#runner)" stroke="#eaffff" stroke-opacity="0.6"/>
    <rect x="-7" y="4" width="14" height="14" rx="4" fill="#0b2628" fill-opacity="0.7"/>
    <ellipse cx="4" cy="-2" rx="7" ry="6" fill="#c8fbff" fill-opacity="0.9"/>
    <circle cx="6" cy="-2" r="2" fill="#10201c"/><circle cx="6.8" cy="-2.6" r="0.8" fill="#fff"/>
    <rect x="-22" y="6" width="8" height="14" rx="4" fill="#2dd6b8" transform="rotate(-20 -18 13)"/>
    <rect x="14" y="2" width="8" height="16" rx="4" fill="#2dd6b8" transform="rotate(25 18 10)"/>
    <rect x="-10" y="26" width="8" height="18" rx="4" fill="#1fa88f" transform="rotate(15 -6 35)"/>
    <rect x="4" y="24" width="8" height="18" rx="4" fill="#1fa88f" transform="rotate(-25 8 33)"/>
    <path d="M-4 28 L-10 42 L4 34 Z" fill="#73ffe2" fill-opacity="0.7"/>
  </g>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">SAUTEZ · GLISSEZ · TENEZ LA DISTANCE</text>
</svg>
