<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Runner</title>
  <desc id="desc">Un coureur néon bondit à grande vitesse au-dessus d'obstacles sur une piste lumineuse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="0.55" stop-color="#0b1024"/>
      <stop offset="1" stop-color="#061018"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7bffe5" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7bffe5" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="runner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62ffe0"/>
      <stop offset="0.5" stop-color="#8b8bff"/>
      <stop offset="1" stop-color="#ff6bbe"/>
    </linearGradient>
    <linearGradient id="trail" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#8b8bff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#8b8bff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="380" rx="24" fill="url(#bg)"/>

  <!-- stars / speed dust -->
  <g fill="#d5e0ff" opacity="0.8">
    <circle cx="90" cy="70" r="2"/><circle cx="210" cy="48" r="1.5"/><circle cx="430" cy="64" r="2"/>
    <circle cx="610" cy="52" r="1.5"/><circle cx="560" cy="130" r="2"/><circle cx="140" cy="150" r="1.5"/>
  </g>
  <g stroke="#7ddcff" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M40 120h46"/><path d="M520 96h38"/><path d="M70 210h30"/><path d="M600 170h34"/>
  </g>

  <!-- distant mountains -->
  <path d="M0 275 L90 220 L170 255 L260 190 L360 250 L470 175 L560 235 L650 205 L720 245 L720 380 L0 380 Z" fill="#241a4f" opacity="0.9"/>
  <path d="M0 300 L120 250 L210 285 L320 225 L430 280 L540 235 L640 270 L720 250 L720 380 L0 380 Z" fill="#171233" opacity="0.95"/>

  <text x="360" y="56" text-anchor="middle" fill="#c7a2ff" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="30" letter-spacing="7">NEON RUNNER</text>

  <!-- ground / track -->
  <rect x="0" y="292" width="720" height="88" fill="#101a30"/>
  <g stroke="#2a3f66" stroke-width="1" opacity="0.9">
    <path d="M40 292l-30 88"/><path d="M120 292l-24 88"/><path d="M200 292l-18 88"/><path d="M280 292l-12 88"/>
    <path d="M360 292l-6 88"/><path d="M440 292l0 88"/><path d="M520 292l6 88"/><path d="M600 292l12 88"/><path d="M680 292l18 88"/>
  </g>
  <rect x="0" y="288" width="720" height="6" fill="url(#track)" filter="url(#glow)"/>

  <!-- obstacles -->
  <g filter="url(#glow)">
    <path d="M430 288 l18 -58 l18 58 Z" fill="#1b1140" stroke="#ff6dbd" stroke-width="3"/>
    <path d="M500 288 l22 -40 l22 40 Z" fill="#1b1140" stroke="#ff6dbd" stroke-width="3"/>
    <rect x="575" y="232" width="34" height="56" rx="4" fill="#1b1140" stroke="#ff6dbd" stroke-width="3"/>
  </g>

  <!-- motion trail -->
  <g filter="url(#soft)">
    <ellipse cx="205" cy="205" rx="70" ry="18" fill="url(#trail)" opacity="0.9"/>
    <ellipse cx="165" cy="214" rx="45" ry="10" fill="url(#trail)" opacity="0.6"/>
    <path d="M90 190 q55 -18 120 -8" stroke="#69ffe1" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.35"/>
    <path d="M110 220 q60 -10 110 0" stroke="#8b8bff" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.3"/>
  </g>

  <!-- runner -->
  <g filter="url(#glow)" transform="translate(300 168) rotate(-12)">
    <ellipse cx="0" cy="0" rx="38" ry="34" fill="url(#runner)" stroke="#efffff" stroke-width="3"/>
    <ellipse cx="-10" cy="-8" rx="10" ry="7" fill="#ffffff" opacity="0.85"/>
    <circle cx="15" cy="-4" r="4" fill="#ffffff" opacity="0.9"/>
    <ellipse cx="0" cy="0" rx="44" ry="34" fill="none" stroke="#efffff" stroke-opacity="0.25" stroke-width="2"/>
  </g>

  <!-- jump arc / energy -->
  <path d="M250 250 Q360 120 470 230" fill="none" stroke="#7c88ff" stroke-width="3" stroke-dasharray="8 10" opacity="0.7"/>
  <g fill="#69ffe1" filter="url(#soft)">
    <circle cx="335" cy="165" r="4" opacity="0.9"/>
    <circle cx="360" cy="150" r="3" opacity="0.7"/>
    <circle cx="385" cy="158" r="3.5" opacity="0.8"/>
  </g>

  <text x="360" y="350" text-anchor="middle" fill="#c9bee8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" letter-spacing="4">SAUTEZ • GLISSEZ • TENEZ LA DISTANCE</text>
</svg>
