<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Runner</title>
  <desc id="desc">Un coureur néon elliptique saute et glisse entre des obstacles roses sur une piste lumineuse, en ramassant des orbes.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20133c"/>
      <stop offset="1" stop-color="#090b1c"/>
    </linearGradient>
    <linearGradient id="runner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#62ffe0"/>
      <stop offset="0.52" stop-color="#8b8bff"/>
      <stop offset="1" stop-color="#ff6bbe"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101a30"/>
      <stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="380" rx="24" fill="url(#sky)"/>
  <g class="stars" aria-hidden="true">
    <circle cx="18" cy="26" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="54" cy="64" r="1.4" fill="#dffcff" opacity="0.8"/>
    <circle cx="88" cy="18" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="126" cy="52" r="1.1" fill="#bff6ff" opacity="0.75"/>
    <circle cx="164" cy="86" r="2.0" fill="#ffffff" opacity="0.92"/>
    <circle cx="198" cy="24" r="1.3" fill="#dffcff" opacity="0.78"/>
    <circle cx="236" cy="60" r="2.3" fill="#ffffff" opacity="0.95"/>
    <circle cx="274" cy="14" r="1.5" fill="#bff6ff" opacity="0.8"/>
    <circle cx="312" cy="46" r="1.0" fill="#ffffff" opacity="0.7"/>
    <circle cx="348" cy="78" r="1.9" fill="#dffcff" opacity="0.88"/>
    <circle cx="386" cy="22" r="1.4" fill="#ffffff" opacity="0.82"/>
    <circle cx="424" cy="56" r="2.4" fill="#ffffff" opacity="0.96"/>
    <circle cx="462" cy="32" r="1.1" fill="#bff6ff" opacity="0.72"/>
    <circle cx="498" cy="84" r="1.7" fill="#dffcff" opacity="0.84"/>
    <circle cx="536" cy="16" r="2.1" fill="#ffffff" opacity="0.93"/>
    <circle cx="574" cy="62" r="1.3" fill="#dffcff" opacity="0.76"/>
    <circle cx="612" cy="38" r="1.6" fill="#ffffff" opacity="0.86"/>
    <circle cx="648" cy="74" r="1.1" fill="#bff6ff" opacity="0.7"/>
    <circle cx="684" cy="20" r="2.0" fill="#ffffff" opacity="0.92"/>
    <circle cx="704" cy="96" r="1.4" fill="#dffcff" opacity="0.78"/>
    <circle cx="36" cy="118" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="92" cy="148" r="1.0" fill="#bff6ff" opacity="0.65"/>
    <circle cx="148" cy="108" r="2.0" fill="#ffffff" opacity="0.88"/>
    <circle cx="206" cy="136" r="1.2" fill="#dffcff" opacity="0.72"/>
    <circle cx="262" cy="112" r="1.7" fill="#ffffff" opacity="0.84"/>
    <circle cx="322" cy="142" r="1.1" fill="#bff6ff" opacity="0.68"/>
    <circle cx="378" cy="104" r="1.9" fill="#dffcff" opacity="0.86"/>
    <circle cx="438" cy="132" r="1.3" fill="#ffffff" opacity="0.76"/>
    <circle cx="492" cy="116" r="2.2" fill="#ffffff" opacity="0.9"/>
    <circle cx="548" cy="146" r="1.0" fill="#bff6ff" opacity="0.66"/>
    <circle cx="604" cy="110" r="1.6" fill="#dffcff" opacity="0.82"/>
    <circle cx="662" cy="138" r="1.4" fill="#ffffff" opacity="0.78"/>
    <circle cx="708" cy="156" r="1.8" fill="#ffffff" opacity="0.85"/>
    <circle cx="24" cy="182" r="1.8" fill="#ffffff" opacity="0.84"/>
