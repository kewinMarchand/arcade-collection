<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Defender</title>
  <desc id="desc">Un vaisseau néon au centre de l'espace oriente son bouclier rotatif pour intercepter des photons entrants.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#061327"/>
      <stop offset="0.55" stop-color="#071420"/>
      <stop offset="1" stop-color="#040b14"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#caffed"/>
      <stop offset="0.72" stop-color="#48e2c3"/>
      <stop offset="1" stop-color="#137d6d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.35" stop-color="#73ffe2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00b998" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="neb1" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e0a5" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00e0a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2468b9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2468b9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="380" rx="24" fill="url(#space)"/>
  <g class="stars" aria-hidden="true">
    <circle cx="18" cy="26" r="2.2" fill="#ffffff" opacity="0.95"/>
    <circle cx="54" cy="64" r="1.4" fill="#dffcff" opacity="0.8"/>
    <circle cx="88" cy="18" r="1.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="126" cy="52" r="1.1" fill="#bff6ff" opacity="0.75"/>
    <circle cx="164" cy="86" r="2.0" fill="#ffffff" opacity="0.92"/>
    <circle cx="198" cy="24" r="1.3" fill="#dffcff" opacity="0.78"/>
