<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Defender</title>
  <desc id="desc">Vaisseau central avec bouclier technologique segmenté interceptant des photons sur fond spatial néon quadrillé.</desc>
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.5" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="22%" cy="28%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.14"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="78%" cy="70%" r="32%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.14"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="0.32" stop-color="#caffed"/><stop offset="0.72" stop-color="#48e2c3"/><stop offset="1" stop-color="#137d6d"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="0.35" stop-color="#73ffe2" stop-opacity="0.85"/><stop offset="1" stop-color="#00b998" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#space)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>
  <g fill="#f2fffc" opacity="0.75"><circle cx="30" cy="26" r="1.6"/><circle cx="100" cy="60" r="1"/><circle cx="210" cy="22" r="1.8"/><circle cx="340" cy="40" r="1.1"/><circle cx="500" cy="28" r="1.7"/><circle cx="640" cy="50" r="1.2"/><circle cx="690" cy="20" r="1.5"/></g>
  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">DEFENDER</text>

  <g fill="none" stroke="#69ffe1">
    <circle cx="360" cy="205" r="72" opacity="0.16"/>
    <circle cx="360" cy="205" r="108" opacity="0.26"/>
    <circle cx="360" cy="205" r="160" opacity="0.12"/>
  </g>

  <g filter="url(#glow)">
    <g>
      <line x1="205" y1="110" x2="245" y2="132" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
      <circle cx="200" cy="105" r="8" fill="#ffd36b"/><circle cx="200" cy="105" r="12" fill="none" stroke="#fff3c4" stroke-width="2"/>
    </g>
    <g>
      <line x1="535" y1="110" x2="500" y2="138" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
      <circle cx="540" cy="105" r="8" fill="#ffd36b"/><circle cx="540" cy="105" r="12" fill="none" stroke="#fff3c4" stroke-width="2"/>
    </g>
    <g>
      <line x1="560" y1="300" x2="520" y2="268" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
      <circle cx="565" cy="305" r="8" fill="#ffd36b"/><circle cx="565" cy="305" r="12" fill="none" stroke="#fff3c4" stroke-width="2"/>
    </g>
  </g>

  <g transform="translate(360 205)" filter="url(#glow)">
    <path d="M-10 18 L-6 46 L0 24 L6 46 L10 18 Z" fill="url(#flame)"/>
    <rect x="-24" y="-28" width="48" height="44" rx="17" fill="url(#hull)" stroke="#eaffff" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M-24 -2 L-38 14 L-24 16 Z" fill="#1fa88f"/><path d="M24 -2 L38 14 L24 16 Z" fill="#1fa88f"/>
    <ellipse cx="0" cy="-8" rx="10" ry="11" fill="#237d73"/><ellipse cx="0" cy="-11" rx="5.5" ry="6.5" fill="#c2fff1"/>
    <rect x="-18" y="6" width="4.5" height="7" rx="1" fill="#faffc4"/><rect x="13.5" y="6" width="4.5" height="7" rx="1" fill="#faffc4"/>
    <circle cx="0" cy="22" r="4" fill="#69ffe1" fill-opacity="0.7"/>
  </g>

  <!-- detailed tech shield arc -->
  <g filter="url(#glow)" transform="translate(360 205)">
    <path d="M 0 -108 A 108 108 0 0 1 94 -55" fill="none" stroke="#69ffe1" stroke-width="18" stroke-linecap="round"/>
    <path d="M 2 -102 A 102 102 0 0 1 88 -52" fill="none" stroke="#eaffff" stroke-width="3" stroke-linecap="round" opacity="0.5"/>
    <g stroke="#69ffe1" stroke-width="3" opacity="0.7">
      <line x1="18" y1="-100" x2="24" y2="-112"/><line x1="46" y1="-92" x2="54" y2="-102"/><line x1="70" y1="-78" x2="80" y2="-86"/>
    </g>
    <circle cx="0" cy="-108" r="4" fill="#fff"/><circle cx="94" cy="-55" r="4" fill="#fff"/>
  </g>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">ORIENTEZ LE BOUCLIER · INTERCEPTEZ LES PHOTONS</text>
</svg>
