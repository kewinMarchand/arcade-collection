  </g>


  <ellipse cx="180" cy="120" rx="190" ry="140" fill="url(#neb1)"/>
  <ellipse cx="560" cy="280" rx="220" ry="160" fill="url(#neb2)"/>
  <g stroke="#9fe7ff" stroke-linecap="round" opacity="0.22">
    <line x1="110" y1="20" x2="110" y2="58" stroke-width="1.5"/><line x1="250" y1="10" x2="250" y2="46" stroke-width="1.2"/>
    <line x1="500" y1="300" x2="500" y2="345" stroke-width="1.5"/><line x1="640" y1="250" x2="640" y2="292" stroke-width="1.2"/>
    <line x1="60" y1="250" x2="60" y2="286" stroke-width="1.2"/>
  </g>

  <text x="360" y="52" text-anchor="middle" fill="#69ffe1" font-family="system-ui,Segoe UI,sans-serif" font-weight="800" font-size="28" letter-spacing="6">NEON DEFENDER</text>

  <!-- orbit rings -->
  <g fill="none" stroke="#69ffe1">
    <circle cx="360" cy="205" r="72" opacity="0.18"/>
    <circle cx="360" cy="205" r="108" opacity="0.28"/>
    <circle cx="360" cy="205" r="160" opacity="0.14"/>
  </g>

  <!-- incoming photons -->
  <g filter="url(#glow)">
    <g>
      <line x1="205" y1="110" x2="245" y2="132" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
      <circle cx="200" cy="105" r="8" fill="#ffd36b"/>
      <circle cx="200" cy="105" r="12" fill="none" stroke="#fff3c4" stroke-width="2"/>
    </g>
    <g>
      <line x1="535" y1="110" x2="500" y2="138" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
      <circle cx="540" cy="105" r="8" fill="#ffd36b"/>
      <circle cx="540" cy="105" r="12" fill="none" stroke="#fff3c4" stroke-width="2"/>
    </g>
    <g>
      <line x1="560" y1="300" x2="520" y2="268" stroke="#ffd36b" stroke-width="2" stroke-dasharray="4 6" opacity="0.6"/>
      <circle cx="565" cy="305" r="8" fill="#ffd36b"/>
      <circle cx="565" cy="305" r="12" fill="none" stroke="#fff3c4" stroke-width="2"/>
    </g>
  </g>

  <!-- ship at center -->
  <g transform="translate(360 205)" filter="url(#glow)">
    <!-- engine flame -->
    <path d="M-10 18 L-6 46 L0 24 L6 46 L10 18 Z" fill="url(#flame)"/>
    <!-- hull -->
    <rect x="-24" y="-28" width="48" height="44" rx="17" fill="url(#hull)" stroke="#eaffff" stroke-width="2" stroke-opacity="0.7"/>
    <!-- wings -->
    <path d="M-24 -2 L-38 14 L-24 16 Z" fill="#1fa88f"/>
    <path d="M24 -2 L38 14 L24 16 Z" fill="#1fa88f"/>
    <!-- cockpit -->
    <ellipse cx="0" cy="-8" rx="10" ry="11" fill="#237d73"/>
    <ellipse cx="0" cy="-11" rx="5.5" ry="6.5" fill="#c2fff1"/>
    <!-- lights -->
    <rect x="-18" y="6" width="4.5" height="7" rx="1" fill="#faffc4"/>
    <rect x="13.5" y="6" width="4.5" height="7" rx="1" fill="#faffc4"/>
  </g>

  <!-- rotating shield arc -->
  <g filter="url(#glow)">
    <path d="M 360 97 A 108 108 0 0 1 454 150" fill="none" stroke="#69ffe1" stroke-width="20" stroke-linecap="round"/>
    <path d="M 362 103 A 108 108 0 0 1 446 150" fill="none" stroke="#eaffff" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  </g>

  <text x="360" y="352" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,Segoe UI,sans-serif" font-size="16" letter-spacing="3">PILOTEZ • ORIENTEZ • PROTÉGEZ</text>
</svg>
