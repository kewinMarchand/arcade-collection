    <circle cx="132" cy="188" r="1.0" fill="#bff6ff" opacity="0.62"/>
    <circle cx="188" cy="224" r="1.6" fill="#ffffff" opacity="0.8"/>
    <circle cx="246" cy="176" r="2.1" fill="#dffcff" opacity="0.86"/>
    <circle cx="304" cy="208" r="1.1" fill="#ffffff" opacity="0.68"/>
    <circle cx="360" cy="184" r="1.5" fill="#bff6ff" opacity="0.74"/>
    <circle cx="418" cy="216" r="1.9" fill="#ffffff" opacity="0.88"/>
    <circle cx="476" cy="172" r="1.3" fill="#dffcff" opacity="0.72"/>
    <circle cx="534" cy="202" r="1.0" fill="#ffffff" opacity="0.64"/>
    <circle cx="590" cy="186" r="2.0" fill="#ffffff" opacity="0.85"/>
    <circle cx="646" cy="218" r="1.4" fill="#bff6ff" opacity="0.7"/>
    <circle cx="698" cy="192" r="1.7" fill="#dffcff" opacity="0.82"/>
    <circle cx="48" cy="252" r="1.1" fill="#ffffff" opacity="0.66"/>
    <circle cx="112" cy="276" r="1.8" fill="#dffcff" opacity="0.8"/>
