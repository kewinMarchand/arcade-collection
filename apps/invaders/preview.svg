<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Invaders</title>
  <desc id="desc">Une flotte d'aliens néon expressifs descend vers un vaisseau défenseur qui tire.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/>
      <stop offset="0.52" stop-color="#071713"/>
      <stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <linearGradient id="player" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.32" stop-color="#caffed"/>
      <stop offset="0.72" stop-color="#48e2c3"/>
      <stop offset="1" stop-color="#137d6d"/>
    </linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3a0"/>
      <stop offset="0.4" stop-color="#73ffe2" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#00b998" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#37bfff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#aaffef"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

