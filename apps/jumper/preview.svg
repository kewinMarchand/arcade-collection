<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu de Neon Jumper</title>
  <desc id="desc">Un explorateur néon saute de plateformes technologiques, collecte des noyaux et vise un portail lumineux sur fond quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c211d"/><stop offset="52%" stop-color="#071713"/><stop offset="100%" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="25%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#00e0a5" stop-opacity="0.18"/><stop offset="100%" stop-color="#00e0a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="75%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#24b99b" stop-opacity="0.16"/><stop offset="100%" stop-color="#24b99b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/>
  <rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>
  <g fill="#f2fffc" opacity="0.7">
    <circle cx="70" cy="30" r="1.5"/><circle cx="210" cy="55" r="1"/><circle cx="340" cy="25" r="2"/><circle cx="520" cy="45" r="1"/><circle cx="640" cy="20" r="1.5"/><circle cx="410" cy="70" r="1"/>
  </g>
  <!-- ground platform -->
  <g filter="url(#glow)">
    <rect x="40" y="320" width="640" height="28" rx="8" fill="#102430" stroke="#69ffe1" stroke-opacity="0.6"/>
    <rect x="60" y="324" width="600" height="4" rx="2" fill="#69ffe1" fill-opacity="0.8"/>
  </g>
  <!-- platforms -->
  <g>
    <rect x="120" y="250" width="140" height="18" rx="7" fill="#1b4250" stroke="#69ffe1" stroke-opacity="0.5"/>
    <rect x="132" y="253" width="116" height="3" rx="1.5" fill="#69ffe1" fill-opacity="0.7"/>
    <rect x="320" y="200" width="150" height="18" rx="7" fill="#1b4250" stroke="#69ffe1" stroke-opacity="0.5"/>
    <rect x="332" y="203" width="126" height="3" rx="1.5" fill="#69ffe1" fill-opacity="0.7"/>
    <rect x="520" y="150" width="130" height="18" rx="7" fill="#1b4250" stroke="#69ffe1" stroke-opacity="0.5"/>
    <rect x="532" y="153" width="106" height="3" rx="1.5" fill="#69ffe1" fill-opacity="0.7"/>
  </g>
  <!-- coins -->
  <g filter="url(#glow)">
    <circle cx="190" cy="220" r="12" fill="#ffd36b"/><circle cx="190" cy="220" r="7" fill="none" stroke="#fff7c8" stroke-width="2"/><path d="M190 214l4 6-4 6-4-6z" fill="#7a4200"/>
    <circle cx="395" cy="170" r="12" fill="#ffd36b"/><circle cx="395" cy="170" r="7" fill="none" stroke="#fff7c8" stroke-width="2"/><path d="M395 164l4 6-4 6-4-6z" fill="#7a4200"/>
  </g>
  <!-- enemy drone -->
  <g transform="translate(360,292)" filter="url(#glow)">
    <path d="M0 -12l18 10  -4 12h-28l-4-12z" fill="#ff6fae" stroke="#ff9fce" stroke-width="1.5"/>
    <rect x="-22" y="-2" width="6" height="8" rx="2" fill="#ff79b6"/><rect x="16" y="-2" width="6" height="8" rx="2" fill="#ff79b6"/>
    <ellipse cx="0" cy="-3" rx="6" ry="4" fill="#fff0fa" fill-opacity="0.9"/>
    <circle cx="-5" cy="2" r="2.2" fill="#2a0012"/><circle cx="5" cy="2" r="2.2" fill="#2a0012"/>
    <ellipse cx="0" cy="12" rx="5" ry="2.5" fill="#ffd36b"/>
  </g>
  <!-- player lander -->
  <g transform="translate(160,292)" filter="url(#glow)">
    <path d="M-8 14 L0 28 L8 14 Z" fill="#73ffe2" fill-opacity="0.8"/>
    <rect x="-14" y="-16" width="28" height="28" rx="10" fill="#7fffe5" stroke="#eaffff" stroke-width="1"/>
    <rect x="-8" y="-4" width="16" height="12" rx="4" fill="#081e1c" fill-opacity="0.7"/><rect x="-5" y="-1" width="10" height="3" rx="1.5" fill="#69ffe1"/>
    <ellipse cx="0" cy="-9" rx="9" ry="7" fill="#eaffff" fill-opacity="0.85"/>
    <path d="M-14 0l-6 8 8 2z" fill="#2dd6b8"/><path d="M14 0l6 8-8 2z" fill="#2dd6b8"/>
    <rect x="-11" y="14" width="8" height="4" rx="1" fill="#184a42"/><rect x="3" y="14" width="8" height="4" rx="1" fill="#184a42"/>
  </g>
  <!-- portal -->
  <g transform="translate(585,110)" filter="url(#glow)">
    <ellipse cx="0" cy="28" rx="28" ry="8" fill="#69ffe1" fill-opacity="0.18"/>
    <rect x="-22" y="-27" width="44" height="54" rx="12" fill="#69ffe1" fill-opacity="0.2" stroke="#69ffe1" stroke-width="4"/>
    <rect x="-16" y="-21" width="32" height="42" rx="8" fill="#69ffe1" fill-opacity="0.25"/>
    <text x="0" y="4" text-anchor="middle" font-family="'DM Mono',monospace" font-size="11" font-weight="700" fill="#ffffff">EXIT</text>
  </g>
</svg>
