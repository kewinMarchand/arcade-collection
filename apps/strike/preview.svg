<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Neon Strike</title>
  <desc id="desc">Viseur néon face à des vaisseaux ennemis détaillés approchant sur un fond spatial quadrillé avec grille de perspective.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/>
      <stop offset="0.45" stop-color="#071713"/>
      <stop offset="1" stop-color="#060b12"/>
    </linearGradient>
    <radialGradient id="neb1" cx="25%" cy="22%" r="35%">
      <stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00e0a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="78%" cy="30%" r="30%">
      <stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#24b99b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/>
  <rect width="720" height="380" fill="url(#neb2)"/>

  <!-- background grid -->
  <g stroke="#9bfff0" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720M0 280H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>

  <!-- stars -->
  <g fill="#f2fffc">
    <circle cx="40" cy="30" r="1.5" opacity="0.8"/><circle cx="110" cy="60" r="1" opacity="0.7"/><circle cx="200" cy="24" r="1.8" opacity="0.85"/>
    <circle cx="320" cy="48" r="1.1" opacity="0.7"/><circle cx="470" cy="28" r="1.6" opacity="0.8"/><circle cx="560" cy="66" r="1" opacity="0.7"/>
    <circle cx="650" cy="34" r="1.7" opacity="0.85"/><circle cx="80" cy="140" r="1.2" opacity="0.6"/><circle cx="640" cy="150" r="1.3" opacity="0.65"/>
  </g>

  <!-- perspective floor grid -->
  <g stroke="#7bffe5" stroke-opacity="0.18" stroke-width="1">
    <line x1="0" y1="250" x2="720" y2="250"/>
    <line x1="0" y1="280" x2="720" y2="280"/>
    <line x1="0" y1="315" x2="720" y2="315"/>
    <line x1="0" y1="355" x2="720" y2="355"/>
    <line x1="360" y1="190" x2="0" y2="380"/>
    <line x1="360" y1="190" x2="180" y2="380"/>
    <line x1="360" y1="190" x2="360" y2="380"/>
    <line x1="360" y1="190" x2="540" y2="380"/>
    <line x1="360" y1="190" x2="720" y2="380"/>
  </g>

  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">NEON STRIKE</text>

  <!-- enemy ships -->
  <g filter="url(#glow)">
    <!-- far left ship -->
    <g transform="translate(220,140) scale(0.85)">
      <path d="M0 -22 L22 9 L9 15 L0 7 L-9 15 L-22 9 Z" fill="#ff6dbe" fill-opacity="0.92"/>
      <path d="M0 -18 L6 9 L0 15 L-6 9 Z" fill="#ffffff" fill-opacity="0.45"/>
      <ellipse cx="0" cy="-2" rx="5" ry="6" fill="#f0ffff" fill-opacity="0.9" stroke="#fff" stroke-width="1"/>
      <path d="M-18 7 L0 -3 L18 7" stroke="rgba(255,255,255,0.6)" stroke-width="2" fill="none"/>
      <circle cx="-18" cy="8" r="2" fill="#fff"/><circle cx="18" cy="8" r="2" fill="#fff"/>
      <ellipse cx="0" cy="17" rx="4" ry="5" fill="#ffd36b"/>
    </g>
    <!-- center ship -->
    <g transform="translate(360,165)">
      <path d="M0 -26 L23 -1 L19 12 L6 17 L0 10 L-6 17 L-19 12 L-23 -1 Z" fill="#7bffe5" fill-opacity="0.92"/>
      <rect x="-8" y="-4" width="16" height="10" rx="2" fill="#ffffff" fill-opacity="0.45"/>
      <ellipse cx="0" cy="-1" rx="4.5" ry="5.5" fill="#f0ffff" fill-opacity="0.9" stroke="#fff" stroke-width="1"/>
      <path d="M-19 2 H19 M0 -8 V6" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <circle cx="-21" cy="0" r="2" fill="#fff"/><circle cx="21" cy="0" r="2" fill="#fff"/>
      <ellipse cx="-6" cy="18" rx="3.2" ry="4.5" fill="#ffd36b"/><ellipse cx="6" cy="18" rx="3.2" ry="4.5" fill="#ffd36b"/>
    </g>
    <!-- right ship -->
    <g transform="translate(500,145) scale(0.9)">
      <path d="M0 -26 L10 3 L19 10 L5 7 L0 18 L-5 7 L-19 10 L-10 3 Z" fill="#ffd36b" fill-opacity="0.92"/>
      <path d="M0 -21 L3 9 L0 15 L-3 9 Z" fill="#ffffff" fill-opacity="0.45"/>
      <ellipse cx="0" cy="-2" rx="4.5" ry="5.5" fill="#f0ffff" fill-opacity="0.9" stroke="#fff" stroke-width="1"/>
      <path d="M0 -24 V16" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
      <circle cx="-18" cy="8" r="2" fill="#fff"/><circle cx="18" cy="8" r="2" fill="#fff"/>
      <ellipse cx="0" cy="17" rx="3.5" ry="4.5" fill="#ff9b5f"/>
    </g>
  </g>

  <!-- tracer and impact hint -->
  <g filter="url(#glow)">
    <line x1="430" y1="350" x2="360" y2="165" stroke="#ffd36b" stroke-width="2.5" opacity="0.9"/>
    <circle cx="360" cy="165" r="5" fill="#fff"/>
  </g>

  <!-- reticle -->
  <g stroke="#7bffe5" stroke-width="2.5" filter="url(#glow)" opacity="0.95">
    <circle cx="360" cy="190" r="18" fill="none"/>
    <line x1="334" y1="190" x2="344" y2="190"/><line x1="376" y1="190" x2="386" y2="190"/>
    <line x1="360" y1="164" x2="360" y2="174"/><line x1="360" y1="206" x2="360" y2="216"/>
  </g>

  <text x="360" y="365" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">VISEZ · TIREZ · TENEZ LA VAGUE</text>
</svg>
