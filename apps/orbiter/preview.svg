<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Orbiter</title>
  <desc id="desc">Module d'alunissage détaillé descendant vers des plateformes néon sur un terrain accidenté, sous un ciel spatial quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c211d"/><stop offset="0.45" stop-color="#071713"/><stop offset="1" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="25%" cy="25%" r="35%"><stop offset="0" stop-color="#00e0a5" stop-opacity="0.12"/><stop offset="1" stop-color="#00e0a5" stop-opacity="0"/></radialGradient>
    <radialGradient id="neb2" cx="75%" cy="35%" r="30%"><stop offset="0" stop-color="#24b99b" stop-opacity="0.12"/><stop offset="1" stop-color="#24b99b" stop-opacity="0"/></radialGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eaffff"/><stop offset="0.4" stop-color="#7fffe5"/><stop offset="1" stop-color="#1b8f7b"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3a0"/><stop offset="0.4" stop-color="#73ffe2" stop-opacity="0.85"/><stop offset="1" stop-color="#00b998" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/><rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.07" stroke-width="1">
    <path d="M0 40H720M0 100H720M0 160H720M0 220H720"/>
    <path d="M60 0V260M120 0V260M180 0V260M240 0V260M300 0V260M360 0V260M420 0V260M480 0V260M540 0V260M600 0V260M660 0V260"/>
  </g>
  <g fill="#f2fffc" opacity="0.75"><circle cx="40" cy="28" r="1.6"/><circle cx="130" cy="52" r="1"/><circle cx="240" cy="24" r="1.8"/><circle cx="380" cy="40" r="1.2"/><circle cx="520" cy="26" r="1.6"/><circle cx="660" cy="44" r="1"/></g>
  <text x="360" y="48" text-anchor="middle" fill="#69ffe1" font-family="system-ui,'Space Grotesk',sans-serif" font-weight="800" font-size="26" letter-spacing="5">ORBITER</text>

  <!-- terrain -->
  <path d="M0 300 L60 280 L120 300 L180 260 L260 290 L340 250 L420 285 L500 240 L560 275 L640 255 L720 290 L720 380 L0 380 Z" fill="#0a1f22" stroke="#69ffe1" stroke-opacity="0.35" stroke-width="2"/>
  <path d="M0 305 L60 285 L120 305 L180 265 L260 295 L340 255 L420 290 L500 245 L560 280 L640 260 L720 295" fill="none" stroke="#2dd6b8" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- landing pads -->
  <g filter="url(#glow)">
    <g transform="translate(180,255)">
      <rect x="-30" y="0" width="60" height="8" rx="3" fill="#1b4250" stroke="#69ffe1" stroke-width="2"/>
      <rect x="-2" y="-18" width="4" height="18" fill="#69ffe1" opacity="0.7"/>
      <circle cx="0" cy="-22" r="4" fill="#69ffe1"/><text x="0" y="-30" text-anchor="middle" fill="#69ffe1" font-family="system-ui,monospace" font-size="10" font-weight="700">x2</text>
      <rect x="-24" y="8" width="4" height="16" fill="#16343a"/><rect x="20" y="8" width="4" height="16" fill="#16343a"/>
    </g>
    <g transform="translate(500,235)">
      <rect x="-34" y="0" width="68" height="8" rx="3" fill="#1b4250" stroke="#ffd36b" stroke-width="2"/>
      <rect x="-2" y="-18" width="4" height="18" fill="#ffd36b" opacity="0.7"/>
      <circle cx="0" cy="-22" r="4" fill="#ffd36b"/><text x="0" y="-30" text-anchor="middle" fill="#ffd36b" font-family="system-ui,monospace" font-size="10" font-weight="700">x5</text>
      <rect x="-28" y="8" width="4" height="20" fill="#16343a"/><rect x="24" y="8" width="4" height="20" fill="#16343a"/>
    </g>
  </g>

  <!-- lander -->
  <g transform="translate(360,150)" filter="url(#glow)">
    <path d="M-10 18 L0 44 L10 18 Z" fill="url(#flame)" opacity="0.9"/>
    <rect x="-18" y="-14" width="36" height="28" rx="10" fill="url(#hull)" stroke="#eaffff" stroke-opacity="0.7"/>
    <rect x="-10" y="-4" width="20" height="10" rx="4" fill="#0b2628" fill-opacity="0.7"/>
    <ellipse cx="0" cy="-10" rx="8" ry="6" fill="#c8fbff" fill-opacity="0.9"/>
    <line x1="0" y1="-16" x2="0" y2="-24" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="-26" r="2.5" fill="#ffd36b"/>
    <path d="M-18 6 L-30 18 L-22 20 Z" fill="#2dd6b8"/><path d="M18 6 L30 18 L22 20 Z" fill="#2dd6b8"/>
    <rect x="-28" y="20" width="10" height="3" rx="1.5" fill="#184a42"/><rect x="18" y="20" width="10" height="3" rx="1.5" fill="#184a42"/>
    <line x1="-12" y1="14" x2="-24" y2="20" stroke="#69ffe1" stroke-width="2"/><line x1="12" y1="14" x2="24" y2="20" stroke="#69ffe1" stroke-width="2"/>
  </g>

  <text x="360" y="360" text-anchor="middle" fill="#b9c9e8" font-family="system-ui,'Space Grotesk',sans-serif" font-size="14" letter-spacing="2">CONTRÔLEZ LA POUSSÉE · ALUNISSEZ EN DOUCEUR</text>
</svg>
