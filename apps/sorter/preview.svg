<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu de Neon Sorter</title>
  <desc id="desc">Modules néon détaillés triés en piles et envoyés dans un tampon d'expédition sur fond quadrillé.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c211d"/><stop offset="52%" stop-color="#071713"/><stop offset="100%" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="28%" cy="28%" r="40%">
      <stop offset="0%" stop-color="#00e0a5" stop-opacity="0.18"/><stop offset="100%" stop-color="#00e0a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="72%" cy="35%" r="35%">
      <stop offset="0%" stop-color="#24b99b" stop-opacity="0.16"/><stop offset="100%" stop-color="#24b99b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
