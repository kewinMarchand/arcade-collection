<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 380" role="img" aria-labelledby="title desc">
  <title id="title">Aperçu de Sorter</title>
  <desc id="desc">Étagères néon avec une première rangée sélectionnable et une rangée dessous semi-transparente, palettes de 3 éléments en haut et 5 blocs de défausse.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#081821"/><stop offset="50%" stop-color="#071512"/><stop offset="100%" stop-color="#06100f"/>
    </linearGradient>
    <radialGradient id="neb1" cx="28%" cy="22%" r="38%">
      <stop offset="0%" stop-color="#00e0a5" stop-opacity="0.14"/><stop offset="100%" stop-color="#00e0a5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="neb2" cx="74%" cy="28%" r="34%">
      <stop offset="0%" stop-color="#5a78ff" stop-opacity="0.12"/><stop offset="100%" stop-color="#5a78ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="720" height="380" fill="url(#bg)"/>
  <rect width="720" height="380" fill="url(#neb1)"/>
  <rect width="720" height="380" fill="url(#neb2)"/>
  <g stroke="#9bfff0" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 40H720M0 90H720M0 140H720M0 190H720M0 240H720M0 290H720M0 340H720"/>
    <path d="M60 0V380M120 0V380M180 0V380M240 0V380M300 0V380M360 0V380M420 0V380M480 0V380M540 0V380M600 0V380M660 0V380"/>
  </g>

  <!-- palettes -->
  <g>
    <g transform="translate(90,50)">
      <rect x="0" y="0" width="120" height="52" rx="11" fill="rgba(8,24,30,0.75)" stroke="#69ffe1" stroke-opacity="0.45" filter="url(#soft)"/>
      <g transform="translate(24,26)" filter="url(#glow)"><rect x="-16" y="-13" width="32" height="26" rx="6" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="5" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="2.2" fill="#69ffe1"/></g>
      <g transform="translate(60,26)" filter="url(#glow)"><rect x="-16" y="-13" width="32" height="26" rx="6" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="5" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="2.2" fill="#69ffe1"/></g>
      <circle cx="96" cy="26" r="8" fill="none" stroke="#69ffe1" stroke-opacity="0.25" stroke-width="1.5"/>
    </g>
    <g transform="translate(225,50)">
      <rect x="0" y="0" width="120" height="52" rx="11" fill="rgba(8,24,30,0.75)" stroke="#ffd36b" stroke-opacity="0.4"/>
      <g transform="translate(24,26)"><rect x="-16" y="-13" width="32" height="26" rx="6" fill="#10232d" stroke="#ffd36b" stroke-width="2"/><path d="M0 -7l6 6-2 8h-8l-2-8z" fill="#ffd36b"/></g>
      <circle cx="60" cy="26" r="8" fill="none" stroke="#69ffe1" stroke-opacity="0.2" stroke-width="1.5"/>
      <circle cx="96" cy="26" r="8" fill="none" stroke="#69ffe1" stroke-opacity="0.2" stroke-width="1.5"/>
    </g>
    <g transform="translate(360,50)">
      <rect x="0" y="0" width="120" height="52" rx="11" fill="rgba(8,24,30,0.72)" stroke="#69ffe1" stroke-opacity="0.22"/>
      <circle cx="24" cy="26" r="8" fill="none" stroke="#69ffe1" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="60" cy="26" r="8" fill="none" stroke="#69ffe1" stroke-opacity="0.18" stroke-width="1.5"/>
      <circle cx="96" cy="26" r="8" fill="none" stroke="#69ffe1" stroke-opacity="0.18" stroke-width="1.5"/>
    </g>
  </g>

  <!-- discard -->
  <g>
    <rect x="505" y="49" width="38" height="38" rx="8" fill="rgba(18,18,24,0.6)" stroke="rgba(255,255,255,0.16)" stroke-dasharray="4 3"/>
    <rect x="548" y="49" width="38" height="38" rx="8" fill="rgba(18,18,24,0.6)" stroke="rgba(255,255,255,0.16)" stroke-dasharray="4 3"/>
    <rect x="591" y="49" width="38" height="38" rx="8" fill="rgba(18,18,24,0.6)" stroke="rgba(255,180,120,0.35)"/>
    <g transform="translate(610,68)"><rect x="-13" y="-11" width="26" height="22" rx="5" fill="#10232d" stroke="#ff6fae" stroke-width="1.8"/><rect x="-4.5" y="-7" width="9" height="14" rx="4.5" fill="#ff9fce"/></g>
    <rect x="634" y="49" width="38" height="38" rx="8" fill="rgba(18,18,24,0.6)" stroke="rgba(255,255,255,0.16)" stroke-dasharray="4 3"/>
    <rect x="677" y="49" width="38" height="38" rx="8" fill="rgba(18,18,24,0.6)" stroke="rgba(255,255,255,0.16)" stroke-dasharray="4 3" opacity="0.7"/>
  </g>

  <!-- upward arrow -->
  <g stroke="#69ffe1" stroke-opacity="0.22" stroke-width="2" fill="#69ffe1" fill-opacity="0.18">
    <line x1="360" y1="170" x2="360" y2="118"/>
    <path d="M360 114 L353 126 L367 126 Z"/>
  </g>

  <!-- shelves -->
  <!-- column 1 -->
  <g transform="translate(160,0)">
    <g opacity="0.45"><rect x="-30" y="292" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.35"/><ellipse cx="0" cy="298" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.1"/></g>
    <g transform="translate(0,270)" opacity="0.38"><rect x="-20" y="-16" width="40" height="32" rx="7" fill="#10232d" stroke="#ffd36b" stroke-width="2"/><rect x="-14" y="-11" width="28" height="22" rx="4" fill="#08141a"/><path d="M0 -8l6 6-2 8h-8l-2-8z" fill="#ffd36b"/></g>
    <rect x="-30" y="232" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.4"/><ellipse cx="0" cy="238" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.12"/>
    <g transform="translate(0,206)" filter="url(#glow)"><rect x="-22" y="-18" width="44" height="36" rx="8" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><rect x="-16" y="-12" width="32" height="24" rx="5" fill="#08141a"/><circle cx="0" cy="0" r="7" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="3" fill="#69ffe1"/></g>
  </g>
  <!-- column 2 -->
  <g transform="translate(280,0)">
    <g opacity="0.45"><rect x="-30" y="292" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.35"/><ellipse cx="0" cy="298" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.1"/></g>
    <g transform="translate(0,270)" opacity="0.38"><rect x="-20" y="-16" width="40" height="32" rx="7" fill="#10232d" stroke="#7cff7a" stroke-width="2"/><rect x="-14" y="-11" width="28" height="22" rx="4" fill="#08141a"/><circle cx="0" cy="0" r="6" fill="#7cff7a"/></g>
    <rect x="-30" y="232" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.4"/><ellipse cx="0" cy="238" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.12"/>
    <g transform="translate(0,206)" filter="url(#glow)"><rect x="-22" y="-18" width="44" height="36" rx="8" fill="#10232d" stroke="#8b8bff" stroke-width="2"/><rect x="-16" y="-12" width="32" height="24" rx="5" fill="#08141a"/><path d="M0 -8l10 8-10 8-10-8z" fill="#8b8bff"/><circle cx="0" cy="0" r="2.5" fill="#fff"/></g>
  </g>
  <!-- column 3 -->
  <g transform="translate(400,0)">
    <rect x="-30" y="232" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.4"/><ellipse cx="0" cy="238" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.12"/>
    <g transform="translate(0,206)" filter="url(#glow)"><rect x="-22" y="-18" width="44" height="36" rx="8" fill="#10232d" stroke="#ffd36b" stroke-width="2"/><rect x="-16" y="-12" width="32" height="24" rx="5" fill="#08141a"/><path d="M0 -10l8 8-3 11h-10l-3-11z" fill="#ffd36b"/></g>
  </g>
  <!-- column 4 -->
  <g transform="translate(520,0)">
    <g opacity="0.45"><rect x="-30" y="292" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.35"/><ellipse cx="0" cy="298" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.1"/></g>
    <g transform="translate(0,270)" opacity="0.38"><rect x="-20" y="-16" width="40" height="32" rx="7" fill="#10232d" stroke="#69ffe1" stroke-width="2"/><rect x="-14" y="-11" width="28" height="22" rx="4" fill="#08141a"/><circle cx="0" cy="0" r="5" fill="none" stroke="#69ffe1" stroke-width="2"/><circle cx="0" cy="0" r="2" fill="#69ffe1"/></g>
    <rect x="-30" y="232" width="60" height="4" rx="2" fill="#69ffe1" fill-opacity="0.4"/><ellipse cx="0" cy="238" rx="22" ry="5" fill="#69ffe1" fill-opacity="0.12"/>
    <g transform="translate(0,206)" filter="url(#glow)"><rect x="-22" y="-18" width="44" height="36" rx="8" fill="#10232d" stroke="#ff6fae" stroke-width="2"/><rect x="-16" y="-12" width="32" height="24" rx="5" fill="#08141a"/><rect x="-6" y="-9" width="12" height="18" rx="6" fill="#ff9fce"/></g>
  </g>

  <!-- moving item hint -->
  <g transform="translate(340,150)" filter="url(#glow)" opacity="0.95">
    <rect x="-22" y="-18" width="44" height="36" rx="8" fill="#10232d" stroke="#69ffe1" stroke-width="2"/>
    <rect x="-16" y="-12" width="32" height="24" rx="5" fill="#08141a"/>
    <circle cx="0" cy="0" r="7" fill="none" stroke="#69ffe1" stroke-width="2"/>
    <circle cx="0" cy="0" r="3" fill="#69ffe1"/>
  </g>

  </svg>
