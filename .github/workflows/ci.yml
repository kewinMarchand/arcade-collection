name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Basic checks
        run: |
          node --version
          node --check apps/breaker/game.js
          node --check apps/columns/game.js
          node --check apps/defender/game.js
          node --check apps/drift/game.js
          node --check apps/invaders/game.js
          node --check apps/mines/game.js
          node --check apps/orbiter/game.js
          node --check apps/runner/game.js
          node --check apps/serpent/game.js
          test -f index.html
          test -f site/index.html
          echo "CI checks passed"
