name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Basic checks
        run: |
          node --version
          for f in apps/*/game.js; do echo "checking $f"; node --check "$f"; done
          test -f index.html
          test -f site/index.html
          test -f apps/breach/index.html
          echo "CI checks passed"
